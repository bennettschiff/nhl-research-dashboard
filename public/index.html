        '</div><span class="section-badge" style="background:color-mix(in srgb, var(--teal) 20%, transparent);color:var(--good)">' + activeList.length + '</span></div>' +
        subTabHtml +
        renderDueTable(activeList) +
        '</div>';
    }

    function renderHits() {
      var todayTeams = {};
      state.games.forEach(function(g) {
        todayTeams[g.awayTeam.abbrev] = g;
        todayTeams[g.homeTeam.abbrev] = g;
      });

      var hitters = [];
      Object.keys(todayTeams).forEach(function(team) {
        var game = todayTeams[team];
        var opp = game.awayTeam.abbrev === team ? game.homeTeam.abbrev : game.awayTeam.abbrev;
        var isHome = game.homeTeam.abbrev === team;
        var skaters = (state.teamStats[team] && state.teamStats[team].skaters) || [];
        skaters.forEach(function(sk) {
          var rt = state.realtimeStats[sk.playerId];
          if (!rt || rt.gamesPlayed < 1) return;
          var name = fullNameOf(sk).trim() || (sk.lastName && sk.lastName.default) || '';
          // Compute L10 hits/blocks from game logs if available (game log doesn't have hits, so we surface trend via season rate)
          hitters.push({
            name: name, pos: sk.positionCode || '',
            team: team, opp: opp, isHome: isHome,
            playerId: sk.playerId,
            hits: rt.hits, blockedShots: rt.blockedShots,
            gamesPlayed: rt.gamesPlayed,
            hitsPerGame: rt.hitsPerGame,
            blocksPerGame: rt.blocksPerGame
          });
        });
      });

      // Build status bar: shows loading spinner, error+retry, or success count
      var statusBar = '';
      if (!state.realtimeStatsLoaded) {
        statusBar = '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb, var(--accent) 6%, transparent);border-bottom:1px solid var(--line)">' +
          '<div style="width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 0.9s linear infinite;flex-shrink:0"></div>' +
          '<div>' +
            '<div style="font-size:11px;color:var(--accent);font-weight:600">Loading hits &amp; blocks data...</div>' +
            '<div style="font-size:9px;color:var(--faint);margin-top:1px">Fetching from NHL legacy API — season ' + getSeasonId() + '</div>' +
          '</div>' +
        '</div>';
      } else if (state.realtimeStatsError) {
        statusBar = '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:color-mix(in srgb, var(--bad) 8%, transparent);border-bottom:1px solid color-mix(in srgb, var(--bad) 25%, transparent)">' +
          '<div style="display:flex;align-items:center;gap:10px">' +
            '<span style="font-size:16px">❌</span>' +
            '<div>' +
              '<div style="font-size:11px;color:var(--bad);font-weight:600">NHL Legacy API unavailable</div>' +
              '<div style="font-size:9px;color:var(--sub);margin-top:2px;font-family:monospace">' + state.realtimeStatsError + '</div>' +
              '<div style="font-size:9px;color:var(--faint);margin-top:2px">Season ID attempted: <span style="color:var(--warn)">' + getSeasonId() + '</span></div>' +
            '</div>' +
          '</div>' +
          '<button onclick="retryRealtimeStats()" style="padding:5px 12px;background:color-mix(in srgb, var(--bad) 15%, transparent);border:1px solid color-mix(in srgb, var(--bad) 35%, transparent);border-radius:5px;color:var(--bad);font-size:10px;font-weight:600;cursor:pointer">↻ Retry</button>' +
        '</div>';
      } else if (hitters.length > 0) {
        statusBar = '<div style="display:flex;align-items:center;gap:8px;padding:8px 14px;background:color-mix(in srgb, var(--good) 6%, transparent);border-bottom:1px solid color-mix(in srgb, var(--good) 20%, transparent)">' +
          '<span style="font-size:12px">✓</span>' +
          '<span style="font-size:10px;color:var(--good);font-weight:600">' + hitters.length + ' players loaded</span>' +
          '<span style="font-size:9px;color:var(--faint)">• Season ' + getSeasonId() + ' • sorted by hits/game</span>' +
        '</div>';
      }

      if (hitters.length === 0) {
        return '<div class="section"><div class="section-header"><div class="section-title" style="color:var(--bad)">💥 HITS &amp; BLOCKS</div></div>' +
          statusBar +
          '<div class="no-data" style="padding:32px">' + (state.realtimeStatsError ? 'Retry above to reload hits and blocks data.' : 'No data yet — data loads at the end of the full refresh cycle.') + '</div></div>';
      }

      // Sort by hits/game descending
      hitters.sort(function(a, b) { return b.hitsPerGame - a.hitsPerGame; });

      var html = '<div class="section">' +
        '<div class="section-header"><div>' +
        '<div class="section-title" style="color:var(--bad)">💥 HITS &amp; BLOCKS</div>' +
        '<div class="section-subtitle">Season rates for today\'s players • sorted by hits/game • click row for game log</div>' +
        '</div><span class="section-badge" style="background:color-mix(in srgb, var(--bad) 12%, transparent);color:var(--bad)">' + hitters.length + '</span></div>' +
        statusBar;

      var gridCols = 'minmax(0,190px) 36px 55px 68px 72px 68px 72px';
      html += '<div style="display:grid;grid-template-columns:' + gridCols + ';gap:4px;padding:8px 12px;background:var(--deep);font-size:9px;color:var(--faint);font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5">' +
        '<span>PLAYER</span><span>POS</span><span>vs</span>' +
        '<span style="text-align:center">HITS/G</span><span style="text-align:center">SEASON</span>' +
        '<span style="text-align:center">BLK/G</span><span style="text-align:center">SEASON</span>' +
        '</div>';

      html += '<div class="scroll-container">';
      for (var h = 0; h < hitters.length; h++) {
        var ht = hitters[h];
        var uid = 'hits-' + ht.playerId;
        var hpg = ht.hitsPerGame.toFixed(1);
        var bpg = ht.blocksPerGame.toFixed(1);
        var hCol = ht.hitsPerGame >= 3 ? 'var(--bad)' : ht.hitsPerGame >= 1.5 ? 'var(--warn)' : 'var(--sub)';
        var bCol = ht.blocksPerGame >= 2 ? 'var(--purple)' : ht.blocksPerGame >= 1 ? 'var(--accent)' : 'var(--sub)';
        html += '<div class="il-wrap">' +
          '<div class="il-row" id="il-row-' + uid + '" onclick="toggleInlineLog(' + ht.playerId + ',\'' + uid + '\')" style="display:grid;grid-template-columns:' + gridCols + ';gap:4px;padding:9px 12px;align-items:center;cursor:pointer">' +
          '<div class="name-cell">' + headshot(ht.playerId, ht.team, ht.name, 28) + '<div style="min-width:0"><div class="nm-trunc" style="font-size:12px;font-weight:500;color:var(--txt)" title="' + ht.name + '">' + ht.name + injBadge(playerInjury(ht.playerId, ht.team, ht.name, ht.pos)) + '</div><div style="font-size:10px;color:var(--muted)">' + ht.team + '</div></div></div>' +
          '<span style="font-size:11px;color:var(--muted)">' + ht.pos + '</span>' +
          '<span style="font-size:11px;color:var(--muted)">' + (ht.isHome ? 'vs ' : '@ ') + ht.opp + '</span>' +
          '<span style="text-align:center;font-family:monospace;font-size:15px;font-weight:800;color:' + hCol + '">' + hpg + '</span>' +
          '<span style="text-align:center;font-family:monospace;font-size:12px;color:var(--sub)">' + ht.hits + '</span>' +
          '<span style="text-align:center;font-family:monospace;font-size:15px;font-weight:800;color:' + bCol + '">' + bpg + '</span>' +
          '<span style="text-align:center;font-family:monospace;font-size:12px;color:var(--sub)">' + ht.blockedShots + '</span>' +
          '</div>' +
          '<div class="gamelog-inline" id="il-log-' + uid + '" style="padding:8px 12px"></div>' +
          '</div>';
      }
      html += '</div></div>';
      return html;
    }

    // ========== LAB STATUS + MODEL REFRESH ==========
    // The same block the NFL and NBA labs carry: the shared key's credits and this
    // lab's spend; the last odds pull and model run with the next scheduled of
    // each; and Model Refresh, which replaced the plain Refresh (that only re-read
    // the page's data, which a browser reload still does). It buys tonight's odds
    // and re-runs the ledger snapshot, then reloads the page's data when the run
    // lands. The dialog lives on <body>, outside #app, so a render() never wipes
    // a half-typed password.
    var LAB_RESERVE = 3000;          // every lab's pull refuses to go below this
    function fmtInt(n) { return n == null ? '—' : Number(n).toLocaleString('en-US'); }

    // "9:07 AM" today, "Sat 4:07 PM" this week, "10/24 4:07 PM" before that.
    function labClock(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      var t = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      if (d.toDateString() === new Date().toDateString()) return t;
      if (Math.abs(Date.now() - d.getTime()) / 864e5 < 6) return d.toLocaleDateString('en-US', { weekday: 'short' }) + ' ' + t;
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + t;
    }
    function labRel(iso) {
      if (!iso) return '';
      var m = Math.round((Date.parse(iso) - Date.now()) / 60000), a = Math.abs(m);
      if (a < 1) return 'now';
      var s = a < 60 ? a + 'm' : a < 1440 ? Math.round(a / 60) + 'h' : Math.round(a / 1440) + 'd';
      return m > 0 ? 'in ' + s : s + ' ago';
    }
    // One field of a 5-field cron: *, n, a,b, a-b, */n.
    function cronOk(f, v) {
      return f === '*' || f.split(',').some(function(p) {
        if (p.indexOf('*/') === 0) return v % +p.slice(2) === 0;
        if (p.indexOf('-') > 0) { var ab = p.split('-'); return v >= +ab[0] && v <= +ab[1]; }
        return +p === v;
      });
    }
    // Next firing of a UTC cron after now, within 8 days (ISO string or null).
    function cronNext(expr) {
      var f = String(expr).trim().split(/\s+/), t = new Date(Math.floor(Date.now() / 60000) * 60000);
      for (var i = 0; i < 8 * 1440; i++) {
        t.setTime(t.getTime() + 60000);
        if (cronOk(f[0], t.getUTCMinutes()) && cronOk(f[1], t.getUTCHours()) && cronOk(f[2], t.getUTCDate()) &&
            cronOk(f[3], t.getUTCMonth() + 1) && cronOk(f[4], t.getUTCDay())) return t.toISOString();
      }
      return null;
    }
    // The soonest scheduled job of a kind ('odds' / 'model'): { at, label }.
    function labNext(kind) {
      var best = null;
      ((state.lab.status && state.lab.status.schedule) || []).forEach(function(j) {
        if ((j.kinds || []).indexOf(kind) < 0) return;
        var at = cronNext(j.cron);
        if (at && (!best || at < best.at)) best = { at: at, label: j.label };
      });
      return best;
    }

    function labStatusHtml() {
      var s = state.lab.status;
      if (!s) return '';
      var c = s.credits || {}, low = c.remaining != null && c.remaining < LAB_RESERVE;
      var no = labNext('odds'), nm = labNext('model');
      var tip = function(x) { return x ? 'next: ' + x.label + ', ' + new Date(x.at).toLocaleString('en-US') + ' (' + labRel(x.at) + ')' : 'nothing scheduled in the next 8 days'; };
      var fresher = state.lastUpdated && s.last_model && Date.parse(s.last_model) > state.lastUpdated.getTime() + 60000 && !state.lab.pending;
      return '<div class="credits' + (low ? ' low' : '') + '" title="Shared Odds API key (NFL / NBA / NHL) — 20,000 a month, resets on the 1st. Pulls stop at a 3,000 reserve. As of ' +
          (c.as_of ? new Date(c.as_of).toLocaleString('en-US') : '?') + '.">' +
          'odds api: <b>' + fmtInt(c.used) + '</b> used · <b>' + fmtInt(c.remaining) + '</b> left<br>' +
          '<span class="dim">NHL <b>' + fmtInt(s.lab_today) + '</b> today · <b>' + fmtInt(s.lab_month) + '</b> this month</span></div>' +
        '<div class="credits">' +
          '<div title="Last paid odds pull: ' + (s.last_odds ? new Date(s.last_odds).toLocaleString('en-US') + ' (' + labRel(s.last_odds) + ')' : 'none') + '&#10;' + tip(no) + '">' +
            'odds <b>' + labClock(s.last_odds) + '</b> · next <b>' + labClock(no && no.at) + '</b></div>' +
          '<div title="Model last re-ran and froze the ledger: ' + (s.last_model ? new Date(s.last_model).toLocaleString('en-US') + ' (' + labRel(s.last_model) + ')' : 'never') + '&#10;' + tip(nm) + '">' +
            'model <b>' + labClock(s.last_model) + '</b> · next <b>' + labClock(nm && nm.at) + '</b>' +
            (fresher ? ' <button class="lab-new" onclick="loadAllData()" title="A model run landed after this page loaded">new ↻</button>' : '') + '</div>' +
        '</div>';
    }
    function labBtnHtml() {
      var p = state.lab.pending;
      return '<button class="refresh-btn" onclick="openLabRefresh()" title="' + (p ? 'Refresh running since ' + labClock(p) : 'Buy fresh odds and re-run the model (password)') + '">' +
        '<span style="display:inline-block' + (p ? ';animation:spin 1s linear infinite' : '') + '">↻</span> ' + (p ? 'Refreshing…' : 'Model Refresh') + '</button>' +
        (state.lab.note ? '<div class="lab-note ' + (state.lab.note.ok ? 'pos' : 'neg') + '" role="status">' + state.lab.note.text + '</div>' : '');
    }
    // Repaint just the header pieces — the rest of the page keeps its state.
    function paintLabStatus() {
      var a = document.getElementById('lab-status'); if (a) a.innerHTML = labStatusHtml();
      var b = document.getElementById('lab-btn'); if (b) b.innerHTML = labBtnHtml();
    }
    function setLabNote(ok, text) {
      state.lab.note = { ok: ok, text: text };
      paintLabStatus();
      setTimeout(function() { state.lab.note = null; paintLabStatus(); }, 10000);
    }

    function openLabRefresh() {
      closeLabRefresh();
      var s = state.lab.status || {}, p = state.lab.pending;
      var el = document.createElement('div');
      el.id = 'lab-refresh';
      el.className = 'lab-overlay';
      el.onmousedown = function(e) { if (e.target === el) closeLabRefresh(); };
      el.innerHTML = '<form class="lab-dialog" onsubmit="submitLabRefresh(event)">' +
        '<div class="lab-dialog-title">Model Refresh</div>' +
        (p ? '<div class="lab-dialog-text">Running since ' + labClock(p) + ' (' + labRel(p) + '). The page reloads when the model run lands.</div>' :
          '<div class="lab-dialog-text">Buys fresh odds (' + (s.avg_pull ? 'about ' + fmtInt(s.avg_pull) + ' credits' : 'Odds API credits') + ', from the shared key) and re-runs the model now. Takes 2–6 minutes.</div>' +
          (s.refresh_ready === false ? '<div class="lab-dialog-text amb">Not connected yet: this lab’s GitHub dispatch token is missing in Supabase.</div>' : '') +
          '<input id="lab-pw" type="password" placeholder="Password" autocomplete="off">' +
          '<div class="lab-dialog-actions"><button type="button" class="theme-btn" onclick="closeLabRefresh()">Cancel</button>' +
          '<button type="submit" id="lab-run" class="refresh-btn">Run</button></div>') +
        '<div id="lab-msg" class="lab-dialog-text neg"></div></form>';
      document.body.appendChild(el);
      var pw = document.getElementById('lab-pw'); if (pw) pw.focus();
    }
    function closeLabRefresh() { var el = document.getElementById('lab-refresh'); if (el) el.remove(); }
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLabRefresh(); });

    async function submitLabRefresh(e) {
      e.preventDefault();
      var pw = document.getElementById('lab-pw'), run = document.getElementById('lab-run'), msg = document.getElementById('lab-msg');
      if (!pw || !pw.value) return;
      run.disabled = true; run.textContent = 'Starting…'; msg.textContent = '';
      var r = await requestLabRefresh(pw.value);
      if (!r.ok) { run.disabled = false; run.textContent = 'Run'; msg.textContent = r.message || 'Could not start the run.'; return; }
      closeLabRefresh();
      state.lab.pending = r.requested_at;
      state.lab.note = null;
      paintLabStatus();
      watchLabRefresh();
    }

    // A refresh this page started: poll every 20 s until the model run lands
    // after it, then reload the page's data.
    var _labWatch = null;
    function watchLabRefresh() {
      clearInterval(_labWatch);
      var t0 = Date.parse(state.lab.pending);
      _labWatch = setInterval(async function() {
        var s = await fetchLabStatus();
        if (!s || !state.lab.pending) return;
        var fail = s.refresh && s.refresh.http && s.refresh.http !== 204;
        if (fail || (s.last_model && Date.parse(s.last_model) >= t0) || Date.now() - t0 > 25 * 60000) {
          clearInterval(_labWatch);
          state.lab.pending = null;
          if (fail) setLabNote(false, 'GitHub refused the run (HTTP ' + s.refresh.http + ').');
          else if (Date.now() - t0 > 25 * 60000) setLabNote(false, 'The run has not reported back in 25 minutes — check the workflow.');
          else { setLabNote(true, 'Model updated ' + labClock(s.last_model) + '.'); loadAllData(); }
        }
      }, 20000);
    }

    // ========== TRACKER (graded ledger) ==========
    async function loadTracker() {
      state.tracker = { loading: true };
      var rows = [];
      try {
        var sel = 'game_date,player_id,player,team,opp,market,side,line,price,book,prob_side,fair_side,score,qualifies,is_official,gate_status,actual,hit,units,priced,model_version';
        for (var off = 0; ; off += 1000) {
          var r = await fetch(SUPA_BASE + 'nhl_picks?select=' + sel + '&graded_at=not.is.null&order=game_date.desc,id&limit=1000&offset=' + off, { headers: { apikey: ODDS_FEED_KEY } });
          if (!r.ok) throw new Error('ledger ' + r.status);
          var page = await r.json();
          rows = rows.concat(page);
          if (page.length < 1000) break;
        }
        state.tracker = { rows: rows, loadedAt: new Date() };
      } catch (e) {
        state.tracker = { error: e.message };
      }
      if (state.activeTab === 'tracker') rerenderTab();
    }

    // Below this many decided bets a rate is printed but not colored — 16-7 is a
    // good start, not a verdict. Units are realized money, so they always color.
    var TRK_MIN_N = 25;
    function dateShift(ymd, n) { var a = ymd.split('-'); return localDateStr(new Date(+a[0], +a[1] - 1, +a[2] + n)); }
    function record(rs) {
      var settled = rs.filter(function(r) { return r.hit != null; });
      var w = settled.filter(function(r) { return r.hit; }).length;
      var pr = settled.filter(function(r) { return r.units != null; });
      var u = pr.reduce(function(a, r) { return a + Number(r.units); }, 0);
      // hit rate vs what the no-vig price said, on the same priced rows
      var fr = pr.filter(function(r) { return r.fair_side != null; });
      var fair = fr.length ? fr.reduce(function(a, r) { return a + Number(r.fair_side); }, 0) / fr.length : null;
      var fhit = fr.length ? fr.filter(function(r) { return r.hit; }).length / fr.length : null;
      return { n: settled.length, w: w, l: settled.length - w, units: u, roi: pr.length ? u / pr.length : null, priced: pr.length,
        hitPct: settled.length ? w / settled.length : null, fair: fair, fairHit: fhit, fairN: fr.length };
    }
    function pnlCls(v) { return v == null ? 'dim' : v > 0 ? 'pos' : v < 0 ? 'neg' : ''; }
    function fmtU(u) { return (u >= 0 ? '+' : '') + u.toFixed(2) + 'u'; }
    function fmtRoi(roi) { return (roi >= 0 ? '+' : '') + (roi * 100).toFixed(1) + '%'; }
    function recStr(rec) { return rec.w + '–' + rec.l; }
    // "hit 70% vs 52% priced in": did the side win more often than the no-vig
    // price said it would? The plainest read on whether there is an edge at all.
    function beatPrice(rec) {
      if (!rec.fairN) return '';
      var d = (rec.fairHit - rec.fair) * 100;
      var cls = rec.fairN < TRK_MIN_N ? '' : pnlCls(d);
      return '<span title="On ' + rec.fairN + ' priced bets the side won ' + pctStr(rec.fairHit) + ' of the time; the no-vig price implied ' + pctStr(rec.fair) + '">hit <b class="' + cls + '">' + pctStr(rec.fairHit) + '</b> vs ' + pctStr(rec.fair) + ' priced in</span>';
    }
    function earlyTag(n) { return n && n < TRK_MIN_N ? ' <span class="trk-early" title="Fewer than ' + TRK_MIN_N + ' decided bets — read the direction, not the size">early · n=' + n + '</span>' : ''; }
    function bettable(r) {
      var g = (state.gates || {})[r.market] || {};
      var lo = g.priceMin != null ? g.priceMin : -200, hi = g.priceMax != null ? g.priceMax : 300;
      return r.priced && r.hit != null && r.price != null && r.fair_side != null && r.price >= lo && r.price <= hi;
    }
    // prob_side is what changes between versions (v2.2 blends toward the market),
    // so anything judging the model's PROBABILITY reads the current version once
    // it has `min` rows, and says which version it is showing until then.
    function probRows(rs, min) {
      var cv = rs.filter(function(r) { return r.model_version === M.MODEL_VERSION; });
      if (cv.length >= min) return { rows: cv, ver: M.MODEL_VERSION, current: true };
      var vs = {};
      rs.forEach(function(r) { vs[r.model_version] = 1; });
      return { rows: rs, ver: Object.keys(vs).sort().join(' + '), current: false };
    }
    function avgOf(rs, f) { return rs.length ? rs.reduce(function(a, r) { return a + Number(r[f]); }, 0) / rs.length : null; }

    // Cumulative official units by day — the shape of the season in one line.
    function sparkline(daysAsc) {
      if (daysAsc.length < 2) return '';
      var run = 0, pts = [0];
      daysAsc.forEach(function(d) { run += d.units; pts.push(run); });
      var lo = Math.min.apply(null, pts.concat([0])), hi = Math.max.apply(null, pts.concat([0]));
      var span = hi - lo || 1, W = 200, H = 38;
      var xy = pts.map(function(v, i) { return (i / (pts.length - 1) * W).toFixed(1) + ',' + (H - 2 - (v - lo) / span * (H - 4)).toFixed(1); });
      var zy = (H - 2 - (0 - lo) / span * (H - 4)).toFixed(1);
      var col = run >= 0 ? 'var(--good)' : 'var(--bad)';
      return '<svg class="trk-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="Cumulative official units by day">' +
        '<line x1="0" x2="' + W + '" y1="' + zy + '" y2="' + zy + '" style="stroke:var(--line)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>' +
        '<polyline fill="none" style="stroke:' + col + '" stroke-width="2" vector-effect="non-scaling-stroke" points="' + xy.join(' ') + '"/></svg>';
    }

    function heroTile(label, hint, rec, extra, emphasis) {
      var body = !rec.n ? '<div class="trk-big dim">—</div><div class="trk-sub">nothing graded yet</div>' :
        '<div class="trk-big ' + pnlCls(rec.units) + '">' + fmtU(rec.units) + '</div>' +
        '<div class="trk-sub"><b>' + recStr(rec) + '</b>' + (rec.roi != null ? ' · <span class="' + (rec.priced < TRK_MIN_N ? '' : pnlCls(rec.roi)) + '">' + fmtRoi(rec.roi) + ' ROI</span>' : '') + earlyTag(rec.n) + '</div>' +
        (rec.fairN ? '<div class="trk-sub">' + beatPrice(rec) + '</div>' : '');
      return '<div class="trk-hero-tile' + (emphasis ? ' emph' : '') + '"><div class="trk-label">' + label + '</div><div class="trk-hint">' + hint + '</div>' + body + (extra || '') + '</div>';
    }

    function marketCard(m, rows) {
      var g = (state.gates || {})[m] || {};
      var official = g.status === 'official';
      var rs = rows.filter(function(r) { return r.market === m; });
      // official markets: the bets. probation: what WOULD be bet — same gate, not staked
      var head = record(rs.filter(function(r) { return official ? r.is_official : r.qualifies; }));
      var base = record(rs.filter(function(r) { return r.priced; }));
      var every = record(rs);
      var pv = probRows(rs.filter(function(r) { return r.priced && r.hit != null && r.prob_side != null && r.fair_side != null; }), TRK_MIN_N * 4);
      var pr = pv.rows;
      var bm = pr.length ? pr.reduce(function(a, r) { return a + Math.pow(Number(r.prob_side) - (r.hit ? 1 : 0), 2); }, 0) / pr.length : null;
      var bk = pr.length ? pr.reduce(function(a, r) { return a + Math.pow(Number(r.fair_side) - (r.hit ? 1 : 0), 2); }, 0) / pr.length : null;
      // Brier gaps under 1% are noise at this sample — say "even", don't paint it red
      var acc = '<span class="dim">—</span>';
      if (bm != null && bk) {
        var rel = (bk - bm) / bk;
        acc = Math.abs(rel) < 0.01 ? '<span class="dim">≈ even</span>' :
          rel > 0 ? '<span class="pos">model sharper</span>' : '<span class="amb">market sharper</span>';
      }
      var tone = !head.n ? '' : head.units > 0 ? ' up' : head.units < 0 ? ' down' : '';
      return '<div class="trk-mkt' + tone + '"><h4>' + MARKET_LABEL[m] + '<span class="play-badge ' + (official ? 'play-official' : 'play-probation') + '">' + (g.status || '').toUpperCase() + '</span></h4>' +
        '<div class="trk-label">' + (official ? '★ Model plays' : 'Gate plays · tracked, not bet') + '</div>' +
        (head.n ? '<div class="trk-big ' + pnlCls(head.units) + '">' + fmtU(head.units) + '</div>' +
          '<div class="trk-sub"><b>' + recStr(head) + '</b>' + (head.roi != null ? ' · <span class="' + (head.priced < TRK_MIN_N ? '' : pnlCls(head.roi)) + '">' + fmtRoi(head.roi) + ' ROI</span>' : '') + earlyTag(head.n) + '</div>' +
          '<div class="trk-sub">' + beatPrice(head) + '</div>'
          : '<div class="trk-big dim">—</div><div class="trk-sub">no gate plays graded yet</div>') +
        '<div class="trk-rule"></div>' +
        '<div class="trk-line" title="Every priced projection, betting the side the model prefers — the baseline the gate has to beat"><span>Bet every lean</span><span>' +
          (base.priced ? '<span class="' + pnlCls(base.units) + '">' + fmtU(base.units) + '</span> <span class="dim">(' + fmtRoi(base.roi) + ')</span>' : '<span class="dim">—</span>') + '</span></div>' +
        '<div class="trk-line" title="Every projection, priced or not — did the model\'s side happen? Unpriced lines are mostly depth players with no bettable line"><span>Every projection</span><span>' +
          (every.n ? recStr(every) + ' <span class="dim">· ' + pctStr(every.hitPct) + '</span>' : '<span class="dim">—</span>') + '</span></div>' +
        '<div class="trk-line" title="' + (bm != null ? 'Brier score on priced rows, lower is better — model ' + bm.toFixed(4) + ' vs no-vig market ' + bk.toFixed(4) + ' over ' + pr.length + ' bets (' + pv.ver + ')' : 'No priced rows yet') + '"><span>Accuracy vs market</span><span>' + acc + '</span></div>' +
        '</div>';
    }

    // Does a bigger edge pay? If the score means anything, ROI should climb down
    // the table and the gate rows should be the best of it.
    var EDGE_BANDS = [[-Infinity, 0, 'below 0', 'One-sided markets where the model is under the price'], [0, 0.1, '0.00–0.10'], [0.1, 0.2, '0.10–0.20'], [0.2, 0.25, '0.20–0.25'], [0.25, 0.5, '0.25–0.50'], [0.5, Infinity, '0.50+']];
    function edgeTable(rows) {
      var mk = state.trkEdgeMkt || 'all';
      var rs = rows.filter(function(r) { return bettable(r) && r.score != null && (mk === 'all' || r.market === mk); });
      var g = mk === 'all' ? { min: 0.25, max: 0.5 } : ((state.gates || {})[mk] || {});
      var pills = '<div class="trk-pills">' + ['all'].concat(M.MARKETS).map(function(v) {
        return '<button class="mkt-pill' + (mk === v ? ' on' : '') + '" onclick="setTrkEdgeMkt(\'' + v + '\')">' + (v === 'all' ? 'All' : MARKET_LABEL[v]) + '</button>';
      }).join('') + '</div>';
      var t = '<table class="trk-table"><tr><th>Edge</th><th>Bets</th><th>Record</th><th title="Average model probability on the side">Model</th><th title="Average no-vig market probability on the side">Market</th><th>Hit</th><th>Units</th><th>ROI</th></tr>';
      var any = false;
      EDGE_BANDS.forEach(function(b) {
        var a = rs.filter(function(r) { var s = Number(r.score); return s >= b[0] && s < b[1]; });
        if (!a.length) return;
        any = true;
        var rc = record(a), inGate = g.min != null && b[0] >= g.min && b[1] <= g.max;
        var hit = rc.hitPct, mkt = avgOf(a, 'fair_side'), verdict = a.length >= TRK_MIN_N;
        t += '<tr' + (inGate ? ' class="trk-gate-row"' : '') + '><td' + (b[3] ? ' title="' + b[3] + '"' : '') + '>' + b[2] + (inGate ? ' <span class="trk-gate-tag">gate</span>' : '') + '</td>' +
          '<td>' + a.length + '</td><td>' + recStr(rc) + '</td><td class="dim">' + pctStr(avgOf(a, 'prob_side')) + '</td><td class="dim">' + pctStr(mkt) + '</td>' +
          '<td class="' + (verdict ? pnlCls(hit - mkt) : '') + '">' + pctStr(hit) + '</td>' +
          '<td class="' + pnlCls(rc.units) + '">' + fmtU(rc.units) + '</td><td class="' + (verdict ? pnlCls(rc.roi) : 'dim') + '">' + fmtRoi(rc.roi) + '</td></tr>';
      });
      t += '</table>';
      if (!any) t = '<div class="no-data" style="padding:16px">No priced bets in this market yet</div>';
      return '<div class="trk-card"><h4>Does a bigger edge pay?' + pills + '</h4>' +
        '<div class="trk-cap">Every priced lean at a price the gate allows, grouped by edge score. If the edge is real, <b>Hit</b> beats <b>Market</b> and ROI climbs toward the gate rows. Hit is green when the side won more often than the price implied.</div>' +
        '<div class="hscroll">' + t + '</div></div>';
    }

    // Model vs market vs reality, on bets you could actually place. The old
    // all-rows table was dominated by 80%+ unders on depth players with no line.
    function calibrationCard(rows) {
      var pv = probRows(rows.filter(bettable), 300);
      var rs = pv.rows;
      if (!rs.length) return '';
      var bins = [[0, 0.2], [0.2, 0.35], [0.35, 0.5], [0.5, 0.6], [0.6, 0.7], [0.7, 1.01]];
      var t = '<table class="trk-table"><tr><th>Model said</th><th>Bets</th><th>Model</th><th>Market</th><th>Actually hit</th><th>Closer</th></tr>';
      bins.forEach(function(bn) {
        var a = rs.filter(function(r) { var p = Number(r.prob_side); return p >= bn[0] && p < bn[1]; });
        if (!a.length) return;
        var mp = avgOf(a, 'prob_side'), fp = avgOf(a, 'fair_side');
        var hit = a.filter(function(r) { return r.hit; }).length / a.length;
        var dm = Math.abs(mp - hit), df = Math.abs(fp - hit);
        var closer = a.length < TRK_MIN_N ? '<span class="dim">too few</span>' : Math.abs(dm - df) < 0.01 ? '<span class="dim">tie</span>' : dm < df ? '<span class="pos">Model</span>' : '<span class="amb">Market</span>';
        t += '<tr><td>' + (bn[0] === 0 ? 'under 20%' : bn[1] > 1 ? Math.round(bn[0] * 100) + '%+' : Math.round(bn[0] * 100) + '–' + Math.round(bn[1] * 100) + '%') + '</td><td>' + a.length + '</td>' +
          '<td>' + pctStr(mp) + '</td><td>' + pctStr(fp) + '</td><td><b>' + pctStr(hit) + '</b></td><td>' + closer + '</td></tr>';
      });
      t += '</table>';
      var mp = avgOf(rs, 'prob_side'), fp = avgOf(rs, 'fair_side'), hit = rs.filter(function(r) { return r.hit; }).length / rs.length;
      var gap = Math.round((mp - hit) * 100);
      var take = Math.abs(gap) < 1 ? 'Across ' + rs.length + ' bettable leans the model\'s confidence has matched reality (' + pctStr(mp) + ' said, ' + pctStr(hit) + ' hit).' :
        'Across ' + rs.length + ' bettable leans the model said <b>' + pctStr(mp) + '</b>, the market said <b>' + pctStr(fp) + '</b>, and they hit <b>' + pctStr(hit) + '</b> — the model runs ' + Math.abs(gap) + ' pts ' + (gap > 0 ? 'hot' : 'cold') + '. Where <b>Market</b> wins a row, trust the price over the model in that range.';
      return '<div class="trk-card" style="margin:0 12px 12px"><h4>Model vs market vs reality <span class="dim" style="font-size:10px;font-weight:400">' + pv.ver + '</span></h4>' +
        '<div class="trk-cap">' + take + ' Bettable prices only; unpriced lines are left out.' +
        (pv.current ? '' : ' <span class="trk-early" style="font-size:10px">showing ' + pv.ver + ' — ' + M.MODEL_VERSION + ' prices shrink toward the market and take over here at 300 graded bets</span>') + '</div><div class="hscroll">' + t + '</div></div>';
    }
    window.setTrkEdgeMkt = function(m) { state.trkEdgeMkt = m; rerenderTab(); };

    // ---- Record by day, where it's winning, and the pick list ----
    // The day table and the breakdown always describe the WHOLE graded ledger.
    // The pick list owns its filters (date / market / side / player, plus a book
    // or team that only a breakdown click sets, shown as a chip) and they narrow
    // only the list. A market row under a day, or a breakdown row, is "show me
    // those picks": it replaces the list's filters with just that and scrolls there.
    var TRK_RECS = {
      official: ['★ Model plays', 'What was bet', function(r) { return r.is_official; }],
      gate: ['Gate plays', 'Every row that cleared the gate: model plays plus probation markets\' tracked plays', function(r) { return r.qualifies; }],
      priced: ['Every priced lean', 'Every priced projection, betting the side the model prefers', function(r) { return r.priced; }]
    };
    var TRK_NO_FILTERS = { date: null, market: null, side: null, book: null, team: null, q: '' };
    var TRK_TEST = {
      date: function(r, v) { return r.game_date === v; },
      market: function(r, v) { return r.market === v; },
      side: function(r, v) { return r.side === v; },
      book: function(r, v) { return r.book === v; },
      team: function(r, v) { return r.team === v; },
      q: function(r, v) { return (r.player || '').toLowerCase().indexOf(v.trim().toLowerCase()) >= 0; }
    };
    function trkPasses(r, f) {

    var TRK_SPLITS = [

          var r = x.r, p = x.p;
          tn += '<tr' + (isSidelined(p) ? ' class="row-sidelined" title="On the injury report: grades void if he sits"' : '') + '><td class="name"><span class="name-cell" style="gap:6px">' + headshot(p.id, p.team, p.name, 22) + p.shortName + injBadge(p.injury) + '</span></td><td class="dim">' + p.team + (p.isHome ? ' vs ' : ' @ ') + p.opponent + '</td><td>' + MARKET_LABEL[x.m] + '</td>' +
            '<td class="' + (r.side === 'over' ? 'pos' : 'neg') + '">' + (r.side === 'over' ? 'Over ' : 'Under ') + r.line + '</td>' +
            '<td>' + mlStr(r.price) + ' <span class="dim">' + (BOOK_SHORT[r.book] || '') + '</span></td><td>' + pctStr(r.probSide) + '</td><td class="dim">' + pctStr(r.fairSide) + '</td>' +
            '<td>' + (r.ev == null ? '—' : (r.ev >= 0 ? '+' : '') + Math.round(r.ev * 100) + '%') + '</td><td>' + (r.score == null ? '—' : r.score.toFixed(2)) + '</td><td>' + playBadge(r) + '</td></tr>';
        });
        tn += '</table></div>';
      }
      tn += '</div>';

      if (t.loading) return tn + '<div class="section">' + head + '<div class="no-data">Loading graded ledger…</div></div>';
      if (t.error) return tn + '<div class="section">' + head + '<div class="no-data" style="color:var(--bad)">Ledger unavailable: ' + t.error + '</div></div>';
      var rows = t.rows;
      if (!rows.length) return tn + '<div class="section">' + head + '<div class="no-data">Nothing graded yet. The first slate grades overnight (4:17 AM ET) — this fills in from there.</div></div>';

      // ---- headline: what the bets have made, then the tonight board ----
      var off = rows.filter(function(r) { return r.is_official; });
      var days = {};
      off.forEach(function(r) { (days[r.game_date] = days[r.game_date] || []).push(r); });
      var dayKeys = Object.keys(days).sort();
      var dayRecs = dayKeys.map(function(d) { var rc = record(days[d]); rc.date = d; rc.plays = days[d].length; return rc; });
      var cut = dayKeys.length ? dateShift(dayKeys[dayKeys.length - 1], -6) : null;
      var last7 = record(off.filter(function(r) { return cut && r.game_date >= cut; }));
      var offMk = M.MARKETS.filter(function(m) { return ((state.gates || {})[m] || {}).status === 'official'; });
      var probMk = M.MARKETS.filter(function(m) { return offMk.indexOf(m) < 0; });
      var mkNames = function(ms) { return ms.map(function(m) { return MARKET_LABEL[m]; }).join(' + ') || 'none'; };
      // which market is carrying the record — a red total can hide a green market
      var mix = '<div class="trk-mix">' + offMk.map(function(m) {
        var rc = record(off.filter(function(r) { return r.market === m; }));
        return rc.n ? '<span>' + MARKET_LABEL[m] + ' <b class="' + pnlCls(rc.units) + '">' + fmtU(rc.units) + '</b></span>' : '';
      }).join('') + '</div>';
      var hero = '<div class="section"><div class="trk-hero">' +
        heroTile('★ Model plays · season', 'What was bet · ' + mkNames(offMk) + ' · ' + dayKeys.length + ' days', record(off), mix + sparkline(dayRecs), true) +
        heroTile('Last 7 days', 'Model plays since ' + (cut ? cut.slice(5).replace('-', '/') : '—'), last7) +
        heroTile('Probation gate plays', mkNames(probMk) + ' · same gate, tracked not bet', record(rows.filter(function(r) { return r.qualifies && probMk.indexOf(r.market) >= 0; }))) +
        '</div></div>';

      var cards = '<div class="trk-cards">' + M.MARKETS.map(function(m) { return marketCard(m, rows); }).join('') + '</div>';

      return hero + tn + '<div class="section">' + head + cards +
        '<div class="trk-split">' + edgeTable(rows) + breakdownCard(rows) + '</div>' +
        dayTable(rows) + picksCard(rows) +
        calibrationCard(rows) + '</div>';
    }

    // ========== NHL EDGE PLAYER PANEL ==========
    function findSkater(pid) {
      for (var tm in state.teamStats) {
        var list = state.teamStats[tm].skaters || [];
        for (var i = 0; i < list.length; i++) if (String(list[i].playerId) === String(pid)) return { sk: list[i], team: tm };
      }
      return null;
    }
    async function fetchEdge(pid) {
      if (state.edgeCache[pid]) return state.edgeCache[pid];
      var season = getSeasonId();
      var res = await Promise.all([
        fetchAPI('/edge/skater-detail/' + pid + '/' + season + '/2').catch(function() { return null; }),
        fetchAPI('/edge/skater-zone-time/' + pid + '/' + season + '/2').catch(function() { return null; })
      ]);
      state.edgeCache[pid] = { detail: res[0], zone: res[1] };
      return state.edgeCache[pid];
    }
    function ordinal(n) { var v = n % 100; return n + (v >= 11 && v <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th'); }
    var _edgeGp = 0; // percentiles off fewer than 5 games are noise — hidden until then
    function edgeTile(val, label, pctile, title) {
      var bar = '';
      if (pctile != null && isFinite(pctile) && _edgeGp >= 5) {
        var pc = Math.round(pctile * 100);
        var col = pc >= 75 ? 'var(--good)' : pc >= 40 ? 'var(--warn)' : 'var(--bad)';
        bar = '<div class="edge-bar"><i style="width:' + pc + '%;background:' + col + '"></i></div>';
        label += ' · ' + ordinal(pc);
      }
      return '<div class="edge-tile"' + (title ? ' title="' + title + '"' : '') + '><div class="edge-val">' + val + '</div><div class="edge-lab">' + label + '</div>' + bar + '</div>';
    }
    function edgePanelHTML(pid, e) {
      var f = findSkater(pid), sk = f ? f.sk : {};
      var gp = sk.gamesPlayed || 0, toi = sk.avgTimeOnIcePerGame || 0;
      var proj = state.projections.find(function(x) { return x.id === pid; });
      var split = state.toiSplits[pid] || {};
      var d = e && e.detail, z = e && e.zone;
      _edgeGp = gp;
      var tiles = '';
      tiles += edgeTile(gp ? formatTOI(toi) : '—', 'TOI / GP', null, 'This season');
      tiles += edgeTile(gp ? Math.round(toi / 36) + '%' : '—', 'Share of game', null, 'TOI ÷ 60:00 — the "share of possible ice time" idea');
      tiles += edgeTile(gp && split.ppToiPG != null ? formatTOI(split.ppToiPG) : '—', 'PP TOI / GP', null, 'Power-play minutes per game this season');
      if (proj && proj.toiProj) tiles += edgeTile(proj.toiProj.toFixed(1) + 'm', 'Model TOI tonight', null, 'Season TOI blended with last-5 TOI');
      tiles += edgeTile(gp && toi ? ((sk.shots || 0) / (toi * gp / 3600)).toFixed(1) : '—', 'SOG / 60', null);
      var zs = z && z.zoneStarts;
      if (zs) tiles += edgeTile(Math.round(zs.offensiveZoneStartsPctg * 100) + '%', 'OZ starts', zs.offensiveZoneStartsPctgPercentile, 'Share of shifts started with an offensive-zone faceoff');
      var zt = d && d.zoneTimeDetails;
      if (zt) {
        tiles += edgeTile(Math.round(zt.offensiveZonePctg * 100) + '%', 'OZ time', zt.offensiveZonePercentile, 'Share of his on-ice time the puck spends in the offensive zone');
        if (zt.offensiveZoneEvPctg != null) tiles += edgeTile(Math.round(zt.offensiveZoneEvPctg * 100) + '%', 'OZ time 5v5', zt.offensiveZoneEvPercentile);
      }
      var sogs = (d && d.sogSummary) || [];
      function loc(code) { for (var i = 0; i < sogs.length; i++) if (sogs[i].locationCode === code) return sogs[i]; return null; }
      var hd = loc('high'), md = loc('mid'), lg = loc('long'), all = loc('all');
      if (hd) tiles += edgeTile(hd.shots + (hd.goals ? ' <span style="font-size:10px;color:var(--bad)">' + hd.goals + 'G</span>' : ''), 'High-danger SOG', hd.shotsPercentile, 'Within 29 ft of the goal, inside the dots');
      if (md) tiles += edgeTile(md.shots, 'Mid-range SOG', md.shotsPercentile, '29–43 ft');
      if (lg) tiles += edgeTile(lg.shots, 'Long-range SOG', lg.shotsPercentile, '43+ ft');
      if (all && all.shootingPctg != null) tiles += edgeTile((all.shootingPctg * 100).toFixed(1) + '%', 'Shooting %', all.shootingPctgPercentile);
      if (d && d.topShotSpeed) tiles += edgeTile(d.topShotSpeed.imperial.toFixed(1), 'Hardest shot mph', d.topShotSpeed.percentile);
      if (d && d.skatingSpeed && d.skatingSpeed.speedMax) tiles += edgeTile(d.skatingSpeed.speedMax.imperial.toFixed(1), 'Max speed mph', d.skatingSpeed.speedMax.percentile);
      if (d && d.totalDistanceSkated && gp) tiles += edgeTile((d.totalDistanceSkated.imperial / gp).toFixed(2), 'Miles / game', d.totalDistanceSkated.percentile);
      var note = !gp ? 'No ' + seasonLabel() + ' games yet' : (!d ? 'EDGE data not posted yet (updates overnight)' : gp + ' GP · ' + (gp >= 5 ? 'percentiles vs league' : 'percentiles show from 5 GP'));
      return { note: note, grid: '<div class="edge-grid">' + tiles + '</div>' };
    }
    function seasonLabel() { var id = getSeasonId(); return id.slice(0, 4) + '-' + id.slice(6); }

    // Advanced stats sit collapsed above the game log; the game log is what most
    // clicks are for. EDGE is fetched only when the panel is opened, and an open
    // panel stays the default for the next player (per viewer, localStorage).
    var EDGE_OPEN_KEY = 'nhl-lab-edge-open';
    function edgeOpenPref() { try { return localStorage.getItem(EDGE_OPEN_KEY) === '1'; } catch (e) { return false; } }
    function fillEdge(slotId, pid) {

        '<summary class="edge-title"><span class="edge-sum"><b>Advanced stats <span class="edge-caret">▾</span></b><small>NHL EDGE + usage · ' + seasonLabel() + '</small></span><span class="edge-note"></span></summary>' +
        '<div class="edge-body"></div></details>';

    }
    function edgeToggled(det, pid) {

    function renderMethodology() {
      var P = M.PARAMS;
      function item(t, body, f) { return '<div class="methodology-item"><h4>' + t + '</h4><p>' + body + '</p>' + (f ? '<div class="formula">' + f + '</div>' : '') + '</div>'; }
      return '<div class="methodology-panel"><div class="methodology-title">📐 PROJECTION METHODOLOGY · ' + M.MODEL_VERSION + '</div>' +
        '<div class="methodology-grid">' +
        item('1. Rate × minutes', 'Every market is a per-minute rate times projected minutes, adjusted for the opponent. (Public build: the production model is private; this is a simplified reference version.)', 'λ = rate/min × TOI × opp') +
        item('2. Rates, shrunk', 'This season\'s rate is shrunk toward the position average (' + P.POP_MIN + ' pseudo-minutes) so a small sample is not projected at face value.', 'rate = (count + k·league) ÷ (min + k)') +
        item('3. Minutes', 'Season TOI per game blended with the last five games, because deployment changes do predict.', 'TOI = blend(season, L5)') +
        item('4. Goals', 'Shot volume × shooting percentage, shrunk ' + P.SH_K + ' shots toward the position mean.', 'λG = λSOG × sh%') +
        item('5. Distribution', 'Goals, assists and points are Poisson; shots are negative binomial (size ' + P.SOG_NB_SIZE + ') because shot counts are overdispersed.', 'P(over) = 1 − CDF(line)') +
        item('6. Price + edge', 'Consensus line across books, de-vigged, inverted to the market\'s own λ. Edge = ln(λ model ÷ λ market) on the side bet; MODEL % and EV use a market-anchored λ.', 'score = ln(λm ÷ λmkt)') +
        item('7. Model plays', 'Every projection is snapshotted before puck drop and graded. ★ official = edge inside the market\'s band, price between −200 and +300 20+ NHL games of evidence, 3+ games THIS season (role confirmed), market not on probation. Bands move weekly from the graded ledger.', 'gate: lib/nhl-gates.json') +
        '</div>' +
        '<div style="margin-top:12px;padding:12px;background:color-mix(in srgb, var(--warn) 10%, transparent);border-radius:6px;border:1px solid color-mix(in srgb, var(--warn) 20%, transparent)">' +
        '<div style="color:var(--warn);font-weight:600;font-size:11px;margin-bottom:4px">⚠️ Disclaimer</div>' +
        '<p style="font-size:10px;color:var(--muted);line-height:1.5">Statistical models for research only. Injuries come from ESPN\'s injury report (OUT/IR/suspended skaters are left off; day-to-day stay, flagged); healthy scratches are only known once a player misses games. Past performance ≠ future results. Advanced stats: NHL EDGE.</p>' +
        '</div></div>';
    }

    function buildGameLogHTML(logs) {
      if (!logs || !logs.length) return '<div style="color:var(--faint);font-size:10px;padding:6px 0">No 2026-27 games yet — game logs show this regular season only.</div>';

    function toggleGameLog(playerId, rowId) {

      var rowEl = document.getElementById('shooter-' + rowId);
      if (!glEl) return;

        glEl.classList.remove('open');
        rowEl && rowEl.classList.remove('expanded');

      document.querySelectorAll('.shooter-row.expanded').forEach(function(el) { el.classList.remove('expanded'); });

      var slot = 'edge-' + rowId;
      var team = rowId.split('-').pop();
      var _sk = ((state.teamStats[team] && state.teamStats[team].skaters) || []).filter(function(x) { return x.playerId === playerId; })[0];
      var injPrefix = injPanelHTML(playerInjury(playerId, team, _sk ? fullNameOf(_sk).trim() : '', _sk && _sk.positionCode)) +

    // ========== PLAYER MODAL ==========
    function buildPlayerModalHTML(playerId) {
      var proj = null;
      for (var i = 0; i < state.projections.length; i++) {
        if (String(state.projections[i].id) === String(playerId)) { proj = state.projections[i]; break; }
      }
      if (!proj) return '<div style="color:var(--bad);padding:40px;text-align:center">Player not found</div>';

      var logs  = state.playerGameLogs[playerId] || [];
      var odds  = getPlayerOdds(proj.name);
      var prop  = playerModalProp;

      // Today's game + opponent
      var todayGame = null;
      for (var gi = 0; gi < state.games.length; gi++) {
        var gm = state.games[gi];
        if (gm.homeTeam.abbrev === proj.team || gm.awayTeam.abbrev === proj.team) { todayGame = gm; break; }
      }
      var todayOpp = todayGame ? (todayGame.homeTeam.abbrev === proj.team ? todayGame.awayTeam.abbrev : todayGame.homeTeam.abbrev) : null;
      var isHome   = todayGame && todayGame.homeTeam.abbrev === proj.team;

      // Prop odds
      var propOdds = odds ? (prop==='goals'?odds.goalScorer : prop==='pts'?odds.pts : prop==='assists'?odds.assists : odds.sog) : null;
      var oddsLine  = propOdds && propOdds.consensus != null ? propOdds.consensus : (prop==='sog'?2.5:0.5);

      // Stat accessor
      function getStat(g) {
        if (prop==='goals')   return g.goals   || 0;
        if (prop==='pts')     return g.points  || 0;
        if (prop==='assists') return g.assists || 0;
        return g.shots || 0;
      }

      // Hit rate helper
      function hitRate(subset, thr) {
        if (!subset.length) return null;
        thr = thr != null ? thr : oddsLine;
        return subset.filter(function(g){return getStat(g)>=thr;}).length / subset.length;
      }
      function fmtPct(r) { return r==null?'—':Math.round(r*100)+'%'; }
      function pctColor(r) { return r==null?'var(--faint)':r>=0.5?'var(--good)':r>=0.35?'var(--warn)':'var(--bad)'; }

      var h2hLogs  = logs.filter(function(g){ return (g.opponentAbbrev||'')===todayOpp; });
      var rateRows = [
        { label:getSeasonId().slice(2,4) + '/' + getSeasonId().slice(6), r: hitRate(logs) },  // this season's log
        { label:'H2H',   r: hitRate(h2hLogs) },
        { label:'L5',    r: hitRate(logs.slice(0,5)) },
        { label:'L10',   r: hitRate(logs.slice(0,10)) },
        { label:'L20',   r: hitRate(logs.slice(0,20)) }
      ];

      // ---- BAR CHART ----
      var chartGames = logs.slice(0, 15).reverse();
      var vals       = chartGames.map(getStat);
      var maxVal     = Math.max.apply(null, vals.concat([prop==='sog'?4:1]));
      var CHART_H    = 110;
      var threshPx   = (oddsLine / maxVal) * CHART_H;

      var barChart = '<div style="position:relative;padding-bottom:36px">';
      // threshold dashed line
      barChart += '<div style="position:absolute;left:0;right:0;bottom:' + (36+threshPx) + 'px;border-top:1px dashed color-mix(in srgb, var(--accent) 30%, transparent);pointer-events:none;z-index:1"><span style="position:absolute;right:4px;top:-10px;font-size:8px;color:color-mix(in srgb, var(--accent) 50%, transparent)">' + oddsLine + '</span></div>';
      barChart += '<div style="display:flex;align-items:flex-end;gap:3px;height:' + CHART_H + 'px">';
      chartGames.forEach(function(g, idx) {
        var val  = vals[idx];
        var hit  = val >= oddsLine;
        var barH = maxVal > 0 ? Math.max((val/maxVal)*CHART_H, val>0?6:2) : 2;
        var col  = hit ? 'var(--good)' : (val>0 ? 'var(--warn)' : 'var(--faintest)');
        var opp  = g.opponentAbbrev || '?';
        var dt   = (g.gameDate||'').substring(5).replace('-','/');
        var hr   = g.homeRoadFlag==='H' ? '' : '@';
        barChart += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:' + CHART_H + 'px">';
        if (val > 0) barChart += '<div style="font-size:8px;color:var(--txt);font-weight:700;margin-bottom:2px">' + val + '</div>';
        barChart += '<div style="width:100%;min-width:10px;background:' + col + ';height:' + barH + 'px;border-radius:3px 3px 0 0"></div>';
        barChart += '</div>';
      });

    window.openPlayerModal = async function(playerId) {
      playerModalId = String(playerId);

      var modal = document.createElement('div');
      modal.id = 'player-modal-root';
      modal.style.cssText = 'position:fixed;inset:0;z-index:2000;overflow-y:auto;';
      modal.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--modal-bg)"><div style="color:var(--accent);font-family:monospace">Loading player data...</div></div>';
      document.body.appendChild(modal);

      // Fetch logs if not cached
      if (!state.playerGameLogs[playerId] || !state.playerGameLogs[playerId].length) {
        try { state.playerGameLogs[playerId] = await fetchPlayerGameLog(playerId); } catch(e) {}
      }

      modal.innerHTML = buildPlayerModalHTML(playerId);
    };

    window.closePlayerModal = function() {
      var m = document.getElementById('player-modal-root');
      if (m) m.remove();
      playerModalId = null;
    };

    window.switchPlayerProp = function(prop) {
      playerModalProp = prop;
      var m = document.getElementById('player-modal-root');
      if (m && playerModalId) m.innerHTML = buildPlayerModalHTML(playerModalId);
    };

    // ========== LINES TAB ==========
    function renderLines() {
      var isSog = linesProp === 'sog';
      var propLabels = { goals: 'Goals', pts: 'Points', assists: 'Assists', sog: 'SOG' };

      // Build rows from oddsData
      var rows = [];
      Object.keys(state.oddsData).forEach(function(playerKey) {
        var odds = state.oddsData[playerKey];
        var propOdds = odds[linesProp === 'goals' ? 'goalScorer' : linesProp];
        if (!propOdds || !propOdds.books || !Object.keys(propOdds.books).length) return;

        // Match to projection
        var proj = null;
        for (var i = 0; i < state.projections.length; i++) {
          if (state.projections[i].name.toLowerCase() === playerKey) { proj = state.projections[i]; break; }
        }
        var logs = proj ? (state.playerGameLogs[proj.id] || []) : [];

        // Hit rates
        function hitRate(n) {
          var recent = logs.slice(0, Math.min(n, logs.length));
          if (!recent.length) return null;
          var hits = 0;
          recent.forEach(function(g) {
            if (linesProp === 'goals' && (g.goals||0) > 0) hits++;
            else if (linesProp === 'pts' && (g.points||0) > 0) hits++;
            else if (linesProp === 'assists' && (g.assists||0) > 0) hits++;
          });
          return isSog ? null : hits / recent.length;
        }

        // Drought + SOG in drought
        var drought = 0, droughtSog = 0;
        if (!isSog) {
          for (var j = 0; j < logs.length; j++) {
            var g = logs[j];
            var hit = (linesProp === 'goals' && (g.goals||0) > 0) ||
                      (linesProp === 'pts' && (g.points||0) > 0) ||
                      (linesProp === 'assists' && (g.assists||0) > 0);
            if (hit) break;
            drought++;
            droughtSog += g.shots || 0;
          }
        }

        // SOG averages
        var sogL10 = null, sogL20 = null;
        if (logs.length) {
          var l10g = logs.slice(0,10), l20g = logs.slice(0,20);
          if (l10g.length) sogL10 = l10g.reduce(function(s,g){return s+(g.shots||0);},0)/l10g.length;
          if (l20g.length) sogL20 = l20g.reduce(function(s,g){return s+(g.shots||0);},0)/l20g.length;
        }

        var consensus = propOdds.consensus;
        var bestOver  = propOdds.bestOver;

        rows.push({
          key: playerKey,
          name: proj ? proj.name : playerKey.replace(/\b\w/g, function(c){return c.toUpperCase();}),
          team: proj ? (proj.team||'') : '',
          pos:  proj ? (proj.position||'') : '',
          projId: proj ? proj.id : null,
          line: consensus,
          books: propOdds.books,
          bestOver: bestOver,
          l5:  hitRate(5),
          l10: hitRate(10),
          l20: hitRate(20),
          drought: drought,
          droughtSog: droughtSog,
          sogL10: sogL10,
          sogL20: sogL20,
          projProb: proj ? (linesProp==='goals' ? proj.probGoal : linesProp==='pts' ? proj.probPoint : linesProp==='assists' ? proj.probAssist : null) : null,
          projSog: proj ? proj.projSOG : null,
          vsLine: (proj && isSog && consensus != null) ? (proj.projSOG - consensus) : null
        });
      });

      // Sort
      rows.sort(function(a, b) {
        var col = linesSort.col;
        var av, bv;
        if (col === 'l5')   { av = a.l5  != null ? a.l5  : -1; bv = b.l5  != null ? b.l5  : -1; }
        else if (col === 'l10')  { av = a.l10 != null ? a.l10 : -1; bv = b.l10 != null ? b.l10 : -1; }
        else if (col === 'l20')  { av = a.l20 != null ? a.l20 : -1; bv = b.l20 != null ? b.l20 : -1; }
        else if (col === 'drought') { av = a.drought; bv = b.drought; }
        else if (col === 'droughtSog') { av = a.droughtSog; bv = b.droughtSog; }
        else if (col === 'proj') { av = a.projProb != null ? a.projProb : -1; bv = b.projProb != null ? b.projProb : -1; }
        else if (col === 'sogL10') { av = a.sogL10 != null ? a.sogL10 : -1; bv = b.sogL10 != null ? b.sogL10 : -1; }
        else if (col === 'sogL20') { av = a.sogL20 != null ? a.sogL20 : -1; bv = b.sogL20 != null ? b.sogL20 : -1; }
        else if (col === 'vsLine') { av = a.vsLine != null ? a.vsLine : -99; bv = b.vsLine != null ? b.vsLine : -99; }
        else if (BOOKS_ORDER.indexOf(col) >= 0) {
          var bkKey = col === 'hr' ? 'hardrockbet' : col === 'fan' ? 'fanatics' : col === 'fd' ? 'fanduel' : 'draftkings';
          av = a.books[bkKey] && a.books[bkKey].over != null ? a.books[bkKey].over : -9999;
          bv = b.books[bkKey] && b.books[bkKey].over != null ? b.books[bkKey].over : -9999;
        }
        else { av = 0; bv = 0; }
        return linesSort.dir === 'desc' ? bv - av : av - bv;
      });

      var html = '';

      // Prop selector
      html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap">';
      [['goals','⚽ Goals'],['pts','⭐ Points'],['assists','🎽 Assists'],['sog','🎯 SOG']].forEach(function(p) {
        var active = linesProp === p[0];
        html += '<button onclick="window.switchLinesProp(\'' + p[0] + '\')" style="padding:6px 14px;border-radius:5px;border:1px solid ' + (active?'color-mix(in srgb, var(--accent) 35%, transparent)':'var(--line)') + ';background:' + (active?'color-mix(in srgb, var(--accent) 14%, transparent)':'var(--panel)') + ';color:' + (active?'var(--accent)':'var(--muted)') + ';cursor:pointer;font-size:11px;font-weight:' + (active?'600':'400') + '">' + p[1] + '</button>';
      });
      html += '<span style="font-size:10px;color:var(--faint);margin-left:auto">' + rows.length + ' players with lines · click headers to sort</span>';
      html += '</div>';

      if (!rows.length) {
        html += '<div style="padding:40px;text-align:center;color:var(--dim);background:var(--panel);border-radius:8px;border:1px solid var(--line)">';
        html += '<div style="font-size:24px;margin-bottom:8px">📋</div>';
        html += '<div style="font-size:13px;color:var(--muted)">No ' + propLabels[linesProp] + ' odds loaded</div>';
        html += '<div style="font-size:11px;color:var(--dim);margin-top:4px">Reload data to fetch player props</div></div>';
        return html;
      }

      // Grid columns: Player | Line | DK | FD | FAN | HR | (stat cols)
      var cols = isSog
        ? 'minmax(170px,1.8fr) 44px 62px 62px 62px 62px 62px 62px 65px 65px'
        : 'minmax(170px,1.8fr) 44px 62px 62px 62px 62px 52px 52px 60px 48px 58px';

      function sortHd(col, label) {
        var active = linesSort.col === col;
        return '<div onclick="window.sortLines(\'' + col + '\')" style="text-align:center;font-size:9px;color:' + (active?'var(--accent)':'var(--faint)') + ';font-weight:700;cursor:pointer;user-select:none;letter-spacing:0.04em">' + label + (active ? (linesSort.dir==='desc'?' ↓':' ↑') : '') + '</div>';
      }

      html += '<div class="section">';
      // Header
      html += '<div style="display:grid;grid-template-columns:' + cols + ';padding:8px 14px;background:var(--modal-bg);border-bottom:2px solid var(--line);align-items:center">';
      html += '<div style="font-size:9px;color:var(--faint);font-weight:700;letter-spacing:0.04em">PLAYER</div>';
      html += sortHd('line','LINE');
      html += sortHd('draftkings','DK');
      html += sortHd('fanduel','FD');
      html += sortHd('fanatics','FAN');
      html += sortHd('hardrockbet','HR');
      if (isSog) {
        html += sortHd('sogL10','L10 AVG');
        html += sortHd('sogL20','L20 AVG');
        html += sortHd('vsLine','vs LINE');
        html += sortHd('projSog','MODEL');
      } else {
        html += sortHd('l10','L10%');
        html += sortHd('l20','L20%');
        html += sortHd('drought','DROUGHT');
        html += sortHd('droughtSog','SOG');
        html += sortHd('proj','MODEL');
      }
      html += '</div>';

      // Rows
      rows.forEach(function(row, idx) {
        var evenBg = idx % 2 === 0 ? 'transparent' : 'var(--zebra)';
        var rowClick = row.projId ? ' onclick="window.openPlayerModal(' + row.projId + ')"' : '';
        var rowCursor = row.projId ? 'cursor:pointer;' : '';
        html += '<div' + rowClick + ' style="display:grid;grid-template-columns:' + cols + ';padding:6px 14px;border-bottom:1px solid color-mix(in srgb, var(--line) 25%, transparent);background:' + evenBg + ';align-items:center;' + rowCursor + '" onmouseenter="this.style.background=\'color-mix(in srgb, var(--accent) 7%, transparent)\'" onmouseleave="this.style.background=\'' + evenBg + '\'">';

        // Player name
        var shortName = row.name;
        html += '<div style="display:flex;align-items:center;gap:7px;min-width:0">';
        html += headshot(row.projId, row.team, row.name, 26);
        html += '<span class="nm-trunc" style="font-size:13px;color:var(--txt);font-weight:600" title="' + shortName + '">' + shortName + '</span>' + injBadge(playerInjury(row.projId, row.team, row.name, row.pos));
        html += '<span style="font-size:10px;color:var(--dim)">' + row.team + (row.pos ? ' · '+row.pos : '') + '</span>';
        html += '</div>';

        // Line
        html += '<div style="text-align:center;font-size:12px;color:var(--accent);font-family:monospace;font-weight:600">' + (row.line != null ? row.line : '—') + '</div>';

        // Per-book over price (clickable)
        BOOKS_ORDER.forEach(function(bk) {
          var b = row.books[bk];
          var price = b ? b.over : null;
          var isBest = row.bestOver && row.bestOver.book === bk;
          if (price == null) { html += '<div style="text-align:center;color:var(--dim2);font-size:11px">—</div>'; return; }
          var url = buildBetUrl(bk, b.over_link, b.over_sid);
          var ca = url ? ' onclick="window.copyBetLink(\'' + url.replace(/'/g,"\\'") + '\',\'' + (BOOK_DISPLAY[bk]||bk) + '\',event)" title="Copy ' + (BOOK_DISPLAY[bk]||bk) + ' bet link"' : '';
          html += '<div' + ca + ' style="text-align:center;font-family:monospace;font-size:12px;font-weight:' + (isBest?'700':'400') + ';color:' + (isBest?'var(--good)':'var(--sub)') + ';' + (url?'cursor:pointer;':'') + '">' + formatML(price) + '</div>';
        });

        if (isSog) {
          html += '<div style="text-align:center;font-size:12px;font-family:monospace;color:var(--accent)">' + (row.sogL10 != null ? row.sogL10.toFixed(1) : '—') + '</div>';
          html += '<div style="text-align:center;font-size:12px;font-family:monospace;color:var(--sub)">' + (row.sogL20 != null ? row.sogL20.toFixed(1) : '—') + '</div>';
          var vl = row.vsLine;
          html += '<div style="text-align:center;font-size:12px;font-family:monospace;color:' + (vl==null?'var(--line)':vl>0?'var(--good)':'var(--bad)') + ';font-weight:' + (vl!=null&&Math.abs(vl)>=0.5?'700':'400') + '">' + (vl!=null?(vl>0?'+':'')+vl.toFixed(1):'—') + '</div>';
          html += '<div style="text-align:center;font-size:12px;font-family:monospace;color:var(--accent)">' + (row.projSog!=null?row.projSog.toFixed(1):'—') + '</div>';
        } else {
          // L10%
          var l10c = row.l10==null?'var(--line)':row.l10>=0.5?'var(--good)':row.l10>=0.35?'var(--warn)':'var(--bad)';
          html += '<div style="text-align:center;font-size:12px;font-family:monospace;color:' + l10c + ';font-weight:' + (row.l10!=null&&row.l10>=0.5?'700':'400') + '">' + (row.l10!=null?Math.round(row.l10*100)+'%':'—') + '</div>';
          // L20%
          var l20c = row.l20==null?'var(--line)':row.l20>=0.5?'var(--good)':row.l20>=0.35?'var(--warn)':'var(--bad)';
          html += '<div style="text-align:center;font-size:12px;font-family:monospace;color:' + l20c + '">' + (row.l20!=null?Math.round(row.l20*100)+'%':'—') + '</div>';
          // Drought
          var dc = row.drought>=5?'var(--bad)':row.drought>=3?'var(--warn)':'var(--sub)';
          html += '<div style="text-align:center;font-size:12px;font-family:monospace;color:' + dc + ';font-weight:' + (row.drought>=3?'700':'400') + '">' + row.drought + 'G</div>';
          // SOG in drought
          html += '<div style="text-align:center;font-size:12px;font-family:monospace;color:var(--accent)">' + (row.drought>0?row.droughtSog:'—') + '</div>';
          // Model prob
          var pc = row.projProb==null?'var(--line)':row.projProb>=0.5?'var(--good)':row.projProb>=0.3?'var(--warn)':'var(--sub)';
          html += '<div style="text-align:center;font-size:12px;font-family:monospace;color:' + pc + '">' + (row.projProb!=null?Math.round(row.projProb*100)+'%':'—') + '</div>';
        }

        html += '</div>';
      });

      html += '</div>';
      return html;
    }

    window.switchLinesProp = function(prop) {
      linesProp = prop;
      linesSort = { col: prop === 'sog' ? 'sogL10' : 'l10', dir: 'desc' };
      var el = document.getElementById('tab-content');
      if (el && state.activeTab === 'lines') el.innerHTML = renderLines();
    };
    window.sortLines = function(col) {
      if (linesSort.col === col) linesSort.dir = linesSort.dir === 'desc' ? 'asc' : 'desc';
      else { linesSort.col = col; linesSort.dir = 'desc'; }
      var el = document.getElementById('tab-content');
      if (el && state.activeTab === 'lines') el.innerHTML = renderLines();
    };

    function sortDue(col) {
      if (dueSort.col === col) {
        dueSort.dir = dueSort.dir === 'desc' ? 'asc' : 'desc';
      } else {
        dueSort.col = col;
        dueSort.dir = 'desc';
      }
      var contentEl = document.getElementById('tab-content');
      if (contentEl && state.activeTab === 'streaks') contentEl.innerHTML = renderStreaks();
      else render();
    }
    function toggleHideStarted() {
      state.hideStarted = !state.hideStarted;
      // Only re-render the content area so the button click isn't destroyed mid-event
      var contentEl = document.getElementById('tab-content');
      if (contentEl && state.activeTab === 'matchups') {
        contentEl.innerHTML = renderMatchups();
      } else {
        render();
      }
    }
    function switchDueSubTab(tab) {
      dueSubTab = tab;
      var contentEl = document.getElementById('tab-content');
      if (contentEl) contentEl.innerHTML = renderStreaks();
      else render();
    }
    window.switchDueSubTab = switchDueSubTab;
    window.toggleHideStarted = toggleHideStarted;
    window.sortDue = sortDue;

    function render() {
      var app = document.getElementById('app');

      if (state.loading) {
        // Loading screen is managed by startLoadingScreen() + updateStatus() — don't touch DOM here
        return;
      }

      // Loading done — stop particle animation (canvas is about to be replaced)
      if (_loadingAnimId) {
        cancelAnimationFrame(_loadingAnimId);
        _loadingAnimId = null;
      }

      if (state.error) {
        app.innerHTML = '<div class="loading-container"><div style="text-align:center"><div style="font-size:40px;margin-bottom:16px">❌</div><h2 style="color:var(--bad);margin-bottom:8px">Error</h2><p style="color:var(--muted);margin-bottom:16px">' + state.error + '</p><button class="refresh-btn" onclick="loadAllData()">Try Again</button></div></div>';
        return;
      }

      var today = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      var lastUpd = state.lastUpdated ? state.lastUpdated.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '';

      var tabs = [
        { id: 'projections', label: '🎯 Projections', count: state.projections.length },
        { id: 'tracker', label: '📈 Tracker' },
        { id: 'matchups', label: '🏒 Matchups', count: state.games.length },
        { id: 'lines', label: '📋 Lines', count: Object.keys(state.oddsData).length || undefined },
        { id: 'streaks', label: '🔥 Streaks' },
        { id: 'hits', label: '💥 Hits & Blocks' },
        { id: 'methodology', label: '📐 Methodology' }
      ];

      var tabsHtml = '';
      for (var t = 0; t < tabs.length; t++) {
        var tab = tabs[t];
        tabsHtml += '<button class="tab-btn' + (state.activeTab === tab.id ? ' active' : '') + '" onclick="switchTab(\'' + tab.id + '\')">' + tab.label + (tab.count !== undefined ? ' (' + tab.count + ')' : '') + '</button>';
      }

      var content = '';
      if (state.activeTab === 'projections') content = renderProjections();
      else if (state.activeTab === 'matchups') content = renderMatchups();
      else if (state.activeTab === 'lines') content = renderLines();
      else if (state.activeTab === 'streaks') content = renderStreaks();
      else if (state.activeTab === 'hits') content = renderHits();
      else if (state.activeTab === 'methodology') content = renderMethodology();
      else if (state.activeTab === 'tracker') content = renderTracker();

      app.innerHTML = '<header><div class="header-content"><div><h1 class="title">🏒 NHL RESEARCH DASHBOARD <span class="title-badge">BETA</span></h1><p class="subtitle">PLAYER RESEARCH</p></div><div id="lab-status" class="lab-status">' + labStatusHtml() + '</div><div class="header-actions"><span class="last-updated">Updated: ' + lastUpd + '</span>' + themeBtnHtml() + '<div id="lab-btn" class="lab-btn">' + labBtnHtml() + '</div></div></div></header>' +
        '<main><div class="date-banner"><span>📅 ' + today + '</span><span class="game-count">' + state.games.length + ' GAMES TODAY</span></div>' +
        '<div class="tab-nav">' + tabsHtml + '</div><div id="tab-content">' + content + '</div></main>';
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      render();
    }

    // ── Theme ──────────────────────────────────────────────────────────────────
    // Light (default) and Dark. Every color is a CSS var (palette at the top of
    // <style>), so a flip is one attribute on <html> and nothing re-renders —
    // except the two things a var can't reach: the button's own label, and team
    // logos, whose NHL artwork comes in a light-ground and a dark-ground cut.
    var THEME_KEY = 'nhl-lab-theme', DEFAULT_THEME = 'light';
    function currentTheme() { var t = document.documentElement.dataset.theme; return t === 'dark' || t === 'light' ? t : DEFAULT_THEME; }
    function themeBtnHtml() {
      var dark = currentTheme() === 'dark';
      return '<button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Switch to the ' + (dark ? 'light' : 'dark') + ' theme">' +
        (dark ? '☀️ Light' : '🌙 Dark') + '</button>';
    }
    function toggleTheme() {
      var t = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* private window: the flip still works for the visit */ }
      var btn = document.getElementById('theme-btn');
      if (btn) btn.outerHTML = themeBtnHtml();
      document.querySelectorAll('img[data-logo]').forEach(function(img) { img.src = teamLogoUrl(img.dataset.logo); });
    }
    window.toggleTheme = toggleTheme;

    // ── Faces and logos ────────────────────────────────────────────────────────
    // The NHL's own CDN (assets.nhle.com), hot-linked — fine for a non-commercial
    // lab. club-stats / roster rows carry each skater's `headshot` URL, remembered
    // here by id; anything that only has an id + team (ledger rows) builds the
    // same mug path for this season. A face that fails to load falls back to
    // initials (hsFail) and a logo that fails just disappears — never a broken
    // image.
    var _faces = {};
    function rememberFace(id, url) { if (id && url) _faces[id] = url; }
    function headshotUrl(id, team) {
      if (!id) return null;
      return _faces[id] || (team ? 'https://assets.nhle.com/mugs/nhl/' + getSeasonId() + '/' + team + '/' + id + '.png' : null);
    }
    function teamLogoUrl(abbr) { return 'https://assets.nhle.com/logos/nhl/svg/' + abbr + '_' + currentTheme() + '.svg'; }
    function teamLogo(abbr, size) {
      if (!abbr) return '';
      return '<img class="tlogo" data-logo="' + abbr + '" src="' + teamLogoUrl(abbr) + '" alt="" title="' + abbr + '" loading="lazy" onerror="this.remove()" style="width:' + size + 'px;height:' + size + 'px">';
    }
    function initialsOf(name) {
      return String(name || '?').replace(/\./g, ' ').split(/\s+/).filter(Boolean).slice(0, 2).map(function(w) { return w[0]; }).join('').toUpperCase();
    }
    // A face in a circle with the team logo as a corner badge (badge=false drops it).
    function headshot(id, team, name, size, badge) {
      var url = headshotUrl(id, team);
      var b = Math.max(12, Math.round(size * 0.44));
      return '<span class="hs' + (url ? '' : ' hs-noface') + '" style="width:' + size + 'px;height:' + size + 'px">' +
        '<span class="hs-circle">' + (url ? '<img src="' + url + '" alt="" loading="lazy" onerror="hsFail(this)">' : '') +
        '<span class="hs-init" style="font-size:' + Math.round(size * 0.36) + 'px">' + initialsOf(name) + '</span></span>' +
        (badge === false || !team ? '' : '<span class="hs-badge" style="width:' + b + 'px;height:' + b + 'px">' + teamLogo(team, Math.round(b * 0.82)) + '</span>') +
        '</span>';
    }
    function hsFail(img) { var hs = img.closest('.hs'); if (hs) hs.classList.add('hs-noface'); img.remove(); }
    window.hsFail = hsFail;

    function handleSort(col) {
      if (state.sortColumn === col) {
        state.sortDirection = state.sortDirection === 'desc' ? 'asc' : 'desc';
      } else {
        state.sortColumn = col;
        state.sortDirection = 'desc';
      }
      sortProjections();
      rerenderTab();
    }

    // Expose to global
    window.switchTab = switchTab;
    window.handleSort = handleSort;
    window.loadAllData = loadAllData;

    // Close player modal on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') window.closePlayerModal();
    });
    // toggleShooterView already exposed above at definition site

    window.retryRealtimeStats = async function() {
      state.realtimeStatsLoaded = false;
      state.realtimeStatsError = null;
      // Re-render tab immediately to show the loading spinner
      var contentEl = document.getElementById('tab-content');
      if (contentEl) contentEl.innerHTML = renderHits();
      state.realtimeStats = await fetchRealtimeStats();
      if (contentEl) contentEl.innerHTML = renderHits();
    };

    // Kick off canvas animation on the static initial loading screen,
    // then start data loading (which will call startLoadingScreen() to reinit)
    initLoadingCanvas();
    loadAllData();
    setInterval(refreshInjuries, 10 * 60 * 1000);
    document.addEventListener('visibilitychange', function() { if (!document.hidden) refreshInjuries(); });
    // The header's status read, every 5 minutes while the tab is visible and on return to it.
    setInterval(function() { if (!document.hidden) fetchLabStatus(); }, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', function() { if (!document.hidden) fetchLabStatus(); });
  </script>
</body>
</html>
