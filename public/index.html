      state.tracker = null;
      _loadingStep = 0;
      _loadingStartTime = null;
      _loadingStepTimes = [];
      _loadingTotalSteps = 220;
      startLoadingScreen();
      updateStatus('Fetching schedule...');

      try {
        state.games = await fetchTodaysGames();
        fetchLabStatus();
        if (state.games.length === 0) {
          state.loading = false;
          state.lastUpdated = new Date();
          render();
          return;
        }

        updateStatus('Loading standings...');
        state.standings = await fetchStandings();

        var teams = [];
        for (var i = 0; i < state.games.length; i++) {
          var g = state.games[i];
          if (teams.indexOf(g.awayTeam.abbrev) === -1) teams.push(g.awayTeam.abbrev);
          if (teams.indexOf(g.homeTeam.abbrev) === -1) teams.push(g.homeTeam.abbrev);
        }
        _loadingTotalSteps = 4 + teams.length + teams.length * 20 + 4;

        updateStatus('Loading model context...');
        var ctx = await Promise.all([
          fetchPriorSeasonTotals(), fetchTeamTotals(getSeasonId()), fetchTeamTotals(priorSeasonId()),
          fetchGates(), fetchCurrentToiSplits(), fetchInjuries()
        ]);
        state.gates = ctx[3];
        state.toiSplits = ctx[4];

        await pool(teams, 4, async function(team, t) {
          updateStatus('Loading ' + team + ' (' + (t + 1) + '/' + teams.length + ')');
          state.teamStats[team] = await fetchTeamStats(team);
          state.teamSchedules[team] = await fetchTeamSchedule(team);
          var goalies = (state.teamStats[team].goalies || []).slice().sort(function(a, b) {
            // starter = most games this season; before anyone has played, last season's
            var pa = (_priorSeasonTotals.goalies[a.playerId] || {}).gp || 0, pb = (_priorSeasonTotals.goalies[b.playerId] || {}).gp || 0;
            return (b.gamesPlayed || 0) - (a.gamesPlayed || 0) || pb - pa;
          });
          if (goalies.length) {
            state.goalieStats[team] = goalies[0];
            state.goalieGameLogs[goalies[0].playerId] = await fetchPlayerGameLog(goalies[0].playerId);
          }
        });

        // Game logs for every skater who has played this season (recent TOI and
        // form feed the model; the logs feed every expandable row).
        var ids = [];
        Object.keys(state.teamStats).forEach(function(tm) {
          (state.teamStats[tm].skaters || []).forEach(function(sk) { if ((sk.gamesPlayed || 0) > 0) ids.push(sk.playerId); });
        });
        _loadingTotalSteps = _loadingStep + ids.length + 4;
        var done = 0;
        await pool(ids, 8, async function(pid) {
          state.playerGameLogs[pid] = await fetchPlayerGameLog(pid);
          updateStatus('Player data (' + (++done) + '/' + ids.length + ')');
        });

        updateStatus('Fetching odds + tracked ledger...');
        var lr = await Promise.all([fetchOddsData(), fetchLedger(localDateStr(new Date())), fetchRealtimeStats(), fetchRecentPpToi(), fetchLines(teams)]);
        state.ledgerRows = lr[1];
        state.realtimeStats = lr[2];
        state.recentPpToi = lr[3];

        updateStatus('Generating projections...');
        state.projections = buildProjections();
        sortProjections();

        state.loading = false;
        state.lastUpdated = new Date();
        render();

      } catch (err) {
        console.error(err);
        state.loading = false;
        state.error = err.message;
        render();
      }
    }

    function startLoadingScreen() {
      var app = document.getElementById('app');
      app.innerHTML =
        '<div class="loading-container">' +
          '<canvas class="loading-canvas" id="loading-canvas"></canvas>' +
          '<div class="loading-inner">' +
            '<div class="spinner"></div>' +
            '<p class="loading-text">NHL RESEARCH DASHBOARD</p>' +
            '<p style="font-size:9px;color:var(--muted);font-family:monospace;letter-spacing:0.18em;margin-top:3px">PLAYER RESEARCH</p>' +
            '<p class="loading-status" id="loading-status">' + (state.loadingStatus || 'Connecting...') + '</p>' +
            '<div class="loading-progress-wrap"><div class="loading-progress-fill" id="loading-progress-fill"></div></div>' +
            '<p class="loading-eta" id="loading-eta"></p>' +
          '</div>' +
        '</div>';
      initLoadingCanvas();
    }

    function initLoadingCanvas() {
      if (_loadingAnimId) { cancelAnimationFrame(_loadingAnimId); _loadingAnimId = null; }
      var canvas = document.getElementById('loading-canvas');
      if (!canvas) return;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var ctx = canvas.getContext('2d');
      // Canvas can't resolve a CSS var: read the theme's accent once, as r,g,b.
      var accentRgb = (function() {
        var h = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim().replace('#', '');
        var n = parseInt(h, 16);
        return h.length === 6 && !isNaN(n) ? [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(',') : '125,211,252';
      })();
      var ripples = [];
      var lastMX = -999, lastMY = -999;

      function frame() {
        if (!document.getElementById('loading-canvas')) return;

        // Full clear each frame — no trails
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        var mx = _loadingMouseX, my = _loadingMouseY;

        // Spawn ripple if mouse moved enough
        if (Math.abs(mx - lastMX) > 4 || Math.abs(my - lastMY) > 4) {
          ripples.push({ x: mx, y: my, r: 0, maxR: 60 + Math.random() * 60, alpha: 0.55, speed: 1.8 + Math.random() * 1.2 });
          if (ripples.length > 40) ripples.shift();
          lastMX = mx; lastMY = my;
        }

        // Draw and age ripples
        for (var i = ripples.length - 1; i >= 0; i--) {
          var rp = ripples[i];
          rp.r += rp.speed;
          rp.alpha *= 0.93;
          if (rp.alpha < 0.01 || rp.r > rp.maxR) { ripples.splice(i, 1); continue; }

          var progress = rp.r / rp.maxR;
          var lineWidth = (1 - progress) * 1.5 + 0.3;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(' + accentRgb + ',' + rp.alpha + ')';
          ctx.lineWidth = lineWidth;
          ctx.shadowBlur = 8;
          ctx.shadowColor = 'rgba(' + accentRgb + ',0.4)';
          ctx.stroke();
        }
        ctx.shadowBlur = 0;

        _loadingAnimId = requestAnimationFrame(frame);
      }

      frame();
    }

    function updateStatus(s) {
      state.loadingStatus = s;
      _loadingStep++;
      var now = Date.now();
      if (!_loadingStartTime) _loadingStartTime = now;
      _loadingStepTimes.push(now);
      if (_loadingStepTimes.length > 10) _loadingStepTimes.shift();

      var progress = _loadingTotalSteps > 0
        ? Math.min(96, (_loadingStep / _loadingTotalSteps) * 100)
        : 0;

      var etaText = '';
      if (_loadingStep >= 3 && _loadingStartTime) {
        var elapsed = now - _loadingStartTime;
        var avgMs = elapsed / _loadingStep;
        var remaining = Math.max(0, _loadingTotalSteps - _loadingStep);
        var etaSecs = Math.ceil(avgMs * remaining / 1000);
        if (etaSecs > 0 && etaSecs < 600) etaText = '~' + etaSecs + 's remaining';
      }

      var statusEl = document.getElementById('loading-status');
      var fillEl = document.getElementById('loading-progress-fill');
      var etaEl = document.getElementById('loading-eta');
      if (statusEl) statusEl.textContent = s;
      if (fillEl) fillEl.style.width = progress.toFixed(1) + '%';
      if (etaEl) etaEl.textContent = etaText;
    }

    // ========== RENDERING ==========

    // Moved outside render loop — was being redefined 60x per render
    function probCell(prob, conf) {
      var pct = Math.round(prob * 100);
      var alpha = 0.15 + conf * 0.45;
      var bg, col;
      var mix = function(t) { return 'color-mix(in srgb, var(--' + t + ') ' + (alpha * 100).toFixed(1) + '%, transparent)'; };
      if (prob >= 0.55) { bg = mix('good2'); col = 'var(--good2)'; }
      else if (prob >= 0.35) { bg = mix('warn'); col = 'var(--warn)'; }
      else { bg = mix('bad2'); col = 'var(--bad2)'; }
      return '<div style="text-align:center"><span style="display:inline-block;padding:3px 6px;border-radius:4px;background:' + bg + ';font-size:11px;font-weight:600;color:' + col + ';font-family:monospace">' + pct + '%</span><div style="font-size:8px;color:var(--muted);margin-top:1px">c:' + Math.round(conf * 100) + '</div></div>';
    }

    function formatTime(utc) {
      if (!utc) return 'TBD';
      return new Date(utc).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    function formatPct(v) { return Math.round(v * 100) + '%'; }
    function formatDec(v) { return v.toFixed(2); }
    function getProbClass(p) { return p >= 0.55 ? 'prob-high' : p >= 0.40 ? 'prob-medium' : 'prob-low'; }
    function getEdgeClass(e) { return e === 'strong' ? 'edge-strong' : e === 'moderate' ? 'edge-moderate' : 'edge-weak'; }

    function pctStr(v) { return v == null ? '—' : Math.round(v * 100) + '%'; }
    function mlStr(a) { return a == null ? '—' : (a > 0 ? '+' + a : String(a)); }
    var BOOK_SHORT = { draftkings: 'DK', fanduel: 'FD', fanatics: 'FAN', hardrockbet: 'HR' };

    function factorTags(p) {
      var f = p.factors || {}, h = '';
      if (f.oppGaMult >= 1.06) h += '<span class="factor-tag factor-positive" title="Opponent allows goals (shrunk season rate)">Weak D</span>';
      if (f.oppGaMult && f.oppGaMult <= 0.94) h += '<span class="factor-tag factor-negative">Strong D</span>';
      if (f.oppSogMult >= 1.06) h += '<span class="factor-tag factor-positive" title="Opponent allows shots">Shots+</span>';
      if (f.oppSogMult && f.oppSogMult <= 0.94) h += '<span class="factor-tag factor-negative">Shots−</span>';
      if (f.toiTrend > 0.12) h += '<span class="factor-tag factor-positive" title="Last-5 TOI vs season">↑TOI</span>';
      if (f.toiTrend < -0.12) h += '<span class="factor-tag factor-negative">↓TOI</span>';
      if (p.isB2B) h += '<span class="factor-tag factor-negative">B2B</span>';
      if (f.lineupOut >= 0.02 && !isSidelined(p)) h += '<span class="factor-tag factor-positive" title="Regular teammates at his position are out tonight: projected TOI +' + Math.round(f.lineupOut * M.PARAMS.OUT_TOI_K * 100) + '%">Line↑</span>';
      if (p.priorWeight != null && p.priorWeight >= 0.75 && p.gamesPlayed < 10)
        h += '<span class="factor-tag factor-neutral" title="Under 10 games this season: the projection leans on last season (never displayed)">Early</span>';
      return h || '<span style="color:var(--faint)">—</span>';
    }

    function playBadge(r) {
      if (!r) return '<span style="color:var(--dim)">—</span>';
      var res = '';
      if (r.graded) {
        res = r.hit == null ? '<span class="res-badge res-void">VOID</span>'
          : '<span class="res-badge ' + (r.hit ? 'res-win' : 'res-loss') + '">' + (r.hit ? '✓' : '✗') + ' ' + r.actual + '</span>';
      }
      if (r.official) return '<span class="play-badge play-official" title="' + (r.tracked ? 'Tracked snapshot' : 'Live — not yet snapshotted') + '">★ MODEL PLAY' + (r.tracked ? '' : '*') + '</span>' + res;
      if (r.qualifies) return '<span class="play-badge play-probation" title="Juice play: clears the gate, but this market is on probation until its own graded picks earn it in (tracked and graded, not bet)">JUICE' + (r.tracked ? '' : '*') + '</span>' + res;
      if (!r.priced) return '<span class="play-reason">no line</span>' + res;
      return '<span class="play-reason" title="' + (r.reason || '') + '">' + (r.reason || '') + '</span>' + res;
    }

    function isSidelined(p) { return !!(p.injury && p.injury.sidelined); }

    function gameStarted(p) {
      return p.startTimeUTC && new Date(p.startTimeUTC) <= new Date();
    }

    function projFilterBar() {
      function pill(val, label) {
        var on = state.projMarket === val;
        return '<button class="mkt-pill' + (on ? ' on' : '') + '" onclick="setProjMarket(\'' + val + '\')">' + label + '</button>';
      }
      function tog(fn, on, label, cls, title) {
        return '<button class="mkt-toggle' + (cls ? ' ' + cls : '') + (on ? ' on' : '') + '" onclick="' + fn + '()"' + (title ? ' title="' + title + '"' : '') + '>' + (on ? '✓ ' : '') + label + '</button>';
      }
      var base = state.projections.filter(function(p) { return state.projShowOut || !isSidelined(p); });
      var plays = base.filter(function(p) { return p.officialMarkets.length; }).length;
      var juice = base.filter(function(p) { return p.juiceMarkets.length; }).length;
      var outN = state.projections.filter(isSidelined).length;
      var juiceMk = M.MARKETS.filter(function(m) { return state.gates && state.gates[m] && state.gates[m].status === 'probation'; }).map(function(m) { return MARKET_LABEL[m]; }).join(' + ');
      return '<div class="mkt-bar">' + pill('all', 'All') + pill('points', 'Points') + pill('goals', 'Goals') +
        pill('assists', 'Assists') + pill('sog', 'SOG') + '<span class="mkt-sep"></span>' +
        tog('toggleProjPlaysOnly', state.projPlaysOnly, '★ Model plays (' + plays + ')') +
        tog('toggleProjJuiceOnly', state.projJuiceOnly, 'Juice plays (' + juice + ')', 'juice',
          'Clear the same gate on a probation market' + (juiceMk ? ' (' + juiceMk + ')' : '') + ' · tracked and graded, not bet until the weekly review promotes the market') +
        tog('toggleProjHideStarted', state.projHideStarted, 'Hide started') +
        tog('toggleProjShowOut', state.projShowOut, 'Show OUT/IR (' + outN + ')', '',
          state.injuriesError ? 'Injury report unavailable (' + state.injuriesError + ') — using the ledger snapshot\'s status' : 'ESPN injury report: OUT, injured reserve and suspended skaters are hidden by default. DTD rows stay, flagged') + '</div>';
    }

    function sortHead(col, label, cls) {
      var on = state.sortColumn === col;
      return '<button class="sort-btn' + (on ? ' active' : '') + (cls ? ' ' + cls : '') + '" onclick="handleSort(\'' + col + '\')">' + label + (on ? (state.sortDirection === 'desc' ? ' ↓' : ' ↑') : ' ↕') + '</button>';
    }

    function renderProjections() {
      if (state.projections.length === 0) {
        return '<div class="no-data"><p>No projections available</p></div>';
      }
      var mkt = state.projMarket;
      var list = state.projections.filter(function(p) {
        if (state.projHideStarted && gameStarted(p)) return false;
        if (!state.projShowOut && isSidelined(p)) return false;
        // both toggles on = either kind of play
        if (!state.projPlaysOnly && !state.projJuiceOnly) return true;
        var r = mkt === 'all' ? null : p.markets[mkt];
        var isPlay = mkt === 'all' ? p.officialMarkets.length > 0 : !!(r && r.official);
        var isJuice = mkt === 'all' ? p.juiceMarkets.length > 0 : !!(r && r.qualifies && !r.official);
        return (state.projPlaysOnly && isPlay) || (state.projJuiceOnly && isJuice);
      });
      var cap = mkt === 'all' ? 60 : 100;
      var shown = list.slice(0, cap);

      var header, rows = '';
      if (mkt === 'all') {
        header = '<div class="proj-header proj-all">' +
          '<span>PLAYER</span>' + sortHead('toiProj', 'TOI') + sortHead('projShots', 'SOG') + sortHead('projGoals', 'G') +
          sortHead('projAssists', 'A') + sortHead('projPoints', 'PTS') + sortHead('probGoal', 'P(G)') +
          sortHead('probAssist', 'P(A)') + sortHead('probPoint', 'P(PTS)') + sortHead('rank', 'PLAYS') + '<span>FACTORS</span></div>';
        shown.forEach(function(p) {
          var plays = M.MARKETS.filter(function(m) { return p.markets[m] && (p.markets[m].official || p.markets[m].qualifies); }).map(function(m) {
            var r = p.markets[m];
            return '<span class="mini-play ' + (r.official ? 'mini-official' : 'mini-prob') + '" title="' + MARKET_LABEL[m] + ' ' + r.side + ' ' + r.line + ' ' + mlStr(r.price) + '">' +
              (r.official ? '★' : '') + MARKET_LABEL[m] + ' ' + (r.side === 'over' ? 'O' : 'U') + r.line + '</span>';
          }).join('') || '<span style="color:var(--dim)">—</span>';
          rows += projRowWrap(p, '<div class="proj-row proj-all il-row' + (isSidelined(p) ? ' row-sidelined' : '') + '" id="il-row-proj-' + p.id + '" onclick="toggleInlineLog(' + p.id + ',\'proj-' + p.id + '\')">' +
            playerCell(p) +
            '<span class="proj-value" style="color:var(--muted)">' + (p.toiProj ? p.toiProj.toFixed(1) : '—') + '</span>' +
            '<span class="proj-value" style="color:var(--accent)">' + formatDec(p.projShots) + '</span>' +
            '<span class="proj-value" style="color:var(--bad)">' + formatDec(p.projGoals) + '</span>' +
            '<span class="proj-value" style="color:var(--blue)">' + formatDec(p.projAssists) + '</span>' +
            '<span class="proj-value" style="color:var(--warn)">' + formatDec(p.projPoints) + '</span>' +
            probPill(p.probGoal) + probPill(p.probAssist) + probPill(p.probPoint) +
            '<div class="plays-cell">' + plays + '</div>' +
            '<div>' + factorTags(p) + '</div></div>');
        });
      } else {
        header = '<div class="proj-header proj-mkt">' +
          sortHead('rank', 'PLAYER') + sortHead('lambda', 'PROJ') + sortHead('line', 'LINE') + sortHead('probSide', 'MODEL') +
          '<span title="No-vig market probability for the same side">FAIR</span><span>BEST PRICE</span>' + sortHead('ev', 'EV') +
          sortHead('score', 'EDGE') + '<span>STATUS</span><span>FACTORS</span></div>';
        shown.forEach(function(p) {
          var r = p.markets[mkt];
          if (!r) return;
          var sideTxt = (r.side === 'over' ? 'O ' : 'U ') + r.line;
          var evCol = r.ev == null ? 'var(--faint)' : r.ev >= 0.05 ? 'var(--good)' : r.ev >= 0 ? 'var(--warn)' : 'var(--bad)';
          var scCol = r.score == null ? 'var(--faint)' : r.score >= 0.25 ? 'var(--good)' : r.score >= 0.1 ? 'var(--warn)' : 'var(--muted)';
          var price = r.price != null ? '<span style="color:var(--txt)">' + mlStr(r.price) + '</span> <span style="color:var(--faint);font-size:9px">' + (BOOK_SHORT[r.book] || r.book || '') + '</span>' : '<span style="color:var(--dim)">—</span>';
          rows += projRowWrap(p, '<div class="proj-row proj-mkt il-row' + (r.official ? ' row-official' : '') + (!r.priced ? ' row-unpriced' : '') + (isSidelined(p) ? ' row-sidelined' : '') + '" id="il-row-proj-' + p.id + '" onclick="toggleInlineLog(' + p.id + ',\'proj-' + p.id + '\')">' +
            playerCell(p) +
            '<span class="proj-value" style="color:var(--accent)">' + r.lambda.toFixed(2) + '</span>' +
            '<span class="proj-value" style="color:' + (r.side === 'over' ? 'var(--good)' : 'var(--bad)') + '">' + sideTxt + '</span>' +
            probPill(r.probSide) +
            '<span class="proj-value" style="color:var(--sub)">' + pctStr(r.fairSide) + '</span>' +
            '<span class="proj-value">' + price + '</span>' +
            '<span class="proj-value" style="color:' + evCol + '">' + (r.ev == null ? '—' : (r.ev >= 0 ? '+' : '') + Math.round(r.ev * 100) + '%') + '</span>' +
            '<span class="proj-value" style="color:' + scCol + '" title="ln(model λ / market λ) on this side — the gate reads this">' + (r.score == null ? '—' : r.score.toFixed(2)) + '</span>' +
            '<div>' + playBadge(r) + '</div>' +
            '<div>' + factorTags(p) + '</div></div>');
        });
      }

      var tracked = (state.ledgerRows || []).length;
      var snap = null;
      (state.ledgerRows || []).forEach(function(r) { if (!snap || r.snapshot_at > snap) snap = r.snapshot_at; });
      var srcBadge = tracked
        ? '<span class="src-badge src-tracked" title="Rows marked tracked are exactly what the ledger will grade">📌 Tracked · snapshot ' + new Date(snap).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + '</span>'
        : '<span class="src-badge src-live" title="The ledger snapshots after each odds pull (10 AM / 4 PM ET)">Live model · not yet snapshotted</span>';
      var propPlayerCount = Object.keys(state.oddsData || {}).length;
      var oddsStatusHtml = state.oddsLoaded && !state.oddsError && propPlayerCount > 0
        ? '<span class="src-badge src-odds">📊 Props · ' + propPlayerCount + ' players</span>'
        : state.oddsLoaded && state.oddsError ? '<span class="src-badge src-err" title="' + state.oddsError + '">⚠ odds unavailable</span>'
        : '<span class="src-badge src-live">No props posted yet</span>';
      var sub = mkt === 'all'
        ? 'Projected count (λ) per market · ★ = official model play · amber = juice play (probation market, tracked not bet) · OUT/IR/DTD from ESPN\'s injury report · click a row for game log, odds and NHL EDGE'
        : MARKET_LABEL[mkt] + ' vs the consensus line · MODEL = model P(side) · FAIR = no-vig market P(side) · EDGE = ln(λ model / λ market) · gate ' +
          (state.gates && state.gates[mkt] ? state.gates[mkt].status + ' ' + state.gates[mkt].min + '–' + state.gates[mkt].max : '');
      var more = list.length > cap ? '<div style="padding:8px 12px;font-size:10px;color:var(--faint)">Showing ' + cap + ' of ' + list.length + '</div>' : '';
      return '<div class="section"><div class="section-header"><div><div class="section-title" style="color:var(--accent)">🎯 PLAYER PROJECTIONS <span class="section-badge" style="background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent)">' + list.length + '</span>' + srcBadge + oddsStatusHtml + '</div><div class="section-subtitle">' + sub + '</div></div></div>' +
        projFilterBar() + '<div class="hscroll">' + header + '<div class="scroll-container">' + (rows || '<div class="no-data">No rows match</div>') + '</div></div>' + more + '</div>';
    }

    function playerCell(p) {
      var streakHtml = p.streak.type === 'hot' ? '<span class="streak-indicator streak-hot">🔥' + p.streak.length + '</span>'
        : p.streak.type === 'cold' ? '<span class="streak-indicator streak-cold">❄️' + p.streak.length + '</span>' : '';
      return '<div class="name-cell">' + headshot(p.id, p.team, p.name, 30) + '<div class="proj-player"><span class="proj-player-name"><span class="nm-trunc">' + p.shortName + '</span>' + injBadge(p.injury) + splitIcon(p.splits) + ' ' + streakHtml + '</span>' +
        '<span class="proj-player-meta">' + p.team + ' ' + p.position + lineChips(p.id, p.team, p.name, p.position) + ' • ' + (p.isHome ? 'vs ' : '@ ') + p.opponent + ' · ' + p.gamesPlayed + ' GP' + (gameStarted(p) ? ' · <span style="color:var(--warn)">started</span>' : '') + '</span></div></div>';
    }
    function probPill(prob) {
      if (prob == null) return '<span class="proj-value" style="color:var(--faint)">—</span>';
      var cls = prob >= 0.55 ? 'prob-high' : prob >= 0.35 ? 'prob-medium' : 'prob-low';
      return '<div style="text-align:center"><span class="proj-prob ' + cls + '">' + Math.round(prob * 100) + '%</span></div>';
    }
    function projRowWrap(p, inner) {
      return '<div class="il-wrap">' + inner + '<div class="gamelog-inline" id="il-log-proj-' + p.id + '"></div></div>';
    }

    function rerenderTab() {
      var el = document.getElementById('tab-content');
      if (!el) return render();
      if (state.activeTab === 'projections') el.innerHTML = renderProjections();
      else if (state.activeTab === 'tracker') el.innerHTML = renderTracker();
      else render();
    }
    window.setProjMarket = function(m) {
      state.projMarket = m;
      // a market view reads best sorted by edge; All by projected points
      state.sortColumn = m === 'all' ? 'projPoints' : 'rank';
      state.sortDirection = 'desc';
      sortProjections();
      rerenderTab();
    };
    window.toggleProjPlaysOnly = function() { state.projPlaysOnly = !state.projPlaysOnly; rerenderTab(); };
    window.toggleProjJuiceOnly = function() { state.projJuiceOnly = !state.projJuiceOnly; rerenderTab(); };
    window.toggleProjHideStarted = function() { state.projHideStarted = !state.projHideStarted; rerenderTab(); };
    window.toggleProjShowOut = function() { state.projShowOut = !state.projShowOut; rerenderTab(); };

    function renderMatchups() {
      if (state.games.length === 0) {
        return '<div class="no-data"><p>No games today</p></div>';
      }

      var now = state.lastUpdated || new Date();
      var visibleGames = state.games.filter(function(g) {
        if (!state.hideStarted) return true;
        if (!g.startTimeUTC) return true;
        return new Date(g.startTimeUTC) > now;
      });

      var startedCount = state.games.length - visibleGames.length;
      var btnActive = state.hideStarted;
      var btnHtml = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">' +
        '<button onclick="toggleHideStarted()" style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid ' + (btnActive ? 'color-mix(in srgb, var(--accent) 35%, transparent)' : 'var(--line)') + ';background:' + (btnActive ? 'color-mix(in srgb, var(--accent) 12%, transparent)' : 'var(--panel)') + ';color:' + (btnActive ? 'var(--accent)' : 'var(--muted)') + ';cursor:pointer;font-size:11px;font-weight:500;transition:all 0.2s">' +
        (btnActive ? '✓ ' : '') + 'Hide Started Games' +
        '</button>' +
        (startedCount > 0 ? '<span style="font-size:10px;color:var(--faint)">' + startedCount + ' game' + (startedCount > 1 ? 's' : '') + ' already started</span>' : '') +
        '</div>';

      var html = btnHtml;

      if (visibleGames.length === 0) {
        html += '<div class="no-data" style="padding:32px;text-align:center;color:var(--muted)">All games have started</div>';
        return html;
      }

      html += '<div class="matchups-grid">';
      
      for (var i = 0; i < visibleGames.length; i++) {
        var game = visibleGames[i];
        var awayAbbr = game.awayTeam.abbrev;
        var homeAbbr = game.homeTeam.abbrev;
        var awayS = state.standings[awayAbbr] || {};
        var homeS = state.standings[homeAbbr] || {};
        var awayG = state.goalieStats[awayAbbr];
        var homeG = state.goalieStats[homeAbbr];
        
        var awayB2B = isBackToBack(awayAbbr, game.gameDate);
        var homeB2B = isBackToBack(homeAbbr, game.gameDate);
        
        var awayGAA = awayS.gamesPlayed > 0 ? (awayS.goalsAgainst / awayS.gamesPlayed).toFixed(2) : '-';
        var homeGAA = homeS.gamesPlayed > 0 ? (homeS.goalsAgainst / homeS.gamesPlayed).toFixed(2) : '-';
        var awayGF = awayS.gamesPlayed > 0 ? (awayS.goalsFor / awayS.gamesPlayed).toFixed(2) : '-';
        var homeGF = homeS.gamesPlayed > 0 ? (homeS.goalsFor / homeS.gamesPlayed).toFixed(2) : '-';

        var factors = '';
        if (awayB2B) factors += '<div class="matchup-factor"><span>😴</span> ' + awayAbbr + ' B2B</div>';
        if (homeB2B) factors += '<div class="matchup-factor"><span>😴</span> ' + homeAbbr + ' B2B</div>';
        // a GA/G off 1-4 games is noise (PHI "weak D 7.00" after one 7-0 night)
        var _flagA = awayS.gamesPlayed >= 5, _flagH = homeS.gamesPlayed >= 5;
        if (_flagA && parseFloat(awayGAA) > 3.3) factors += '<div class="matchup-factor"><span>🎯</span> ' + awayAbbr + ' weak D (' + awayGAA + ')</div>';
        if (_flagH && parseFloat(homeGAA) > 3.3) factors += '<div class="matchup-factor"><span>🎯</span> ' + homeAbbr + ' weak D (' + homeGAA + ')</div>';
        if (_flagA && parseFloat(awayGAA) < 2.7) factors += '<div class="matchup-factor"><span>🛡️</span> ' + awayAbbr + ' strong D (' + awayGAA + ')</div>';
        if (_flagH && parseFloat(homeGAA) < 2.7) factors += '<div class="matchup-factor"><span>🛡️</span> ' + homeAbbr + ' strong D (' + homeGAA + ')</div>';

        html += '<div class="matchup-card">' +
          '<div class="matchup-header">' +
          '<div class="matchup-teams">' +
          '<div class="matchup-team">' + teamLogo(awayAbbr, 28) + '<span class="team-abbrev">' + awayAbbr + '</span><span style="font-size:10px;color:var(--muted)">(' + (awayS.wins || 0) + '-' + (awayS.losses || 0) + ')</span></div>' +
          '<span style="color:var(--faint);margin:0 6px">@</span>' +
          '<div class="matchup-team">' + teamLogo(homeAbbr, 28) + '<span class="team-abbrev">' + homeAbbr + '</span><span style="font-size:10px;color:var(--muted)">(' + (homeS.wins || 0) + '-' + (homeS.losses || 0) + ')</span></div>' +
          '</div>' +
          '<div class="matchup-time">' + formatTime(game.startTimeUTC) + '</div>' +
          '</div>' +
          '<div class="matchup-content">';

        // Always render factor strip (min-height keeps cards aligned)
        html += '<div style="min-height:32px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden">' + (factors ? factors : '<span style="font-size:10px;color:var(--dim);font-style:italic">No notable factors</span>') + '</div>';


        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;text-align:center">' +
          '<div><div style="font-size:10px;color:var(--muted)">' + awayAbbr + '</div><div style="color:var(--good);font-weight:bold;font-family:monospace">' + awayGF + ' GF/G</div><div style="color:var(--bad);font-weight:bold;font-family:monospace">' + awayGAA + ' GA/G</div></div>' +
          '<div><div style="font-size:10px;color:var(--muted)">' + homeAbbr + '</div><div style="color:var(--good);font-weight:bold;font-family:monospace">' + homeGF + ' GF/G</div><div style="color:var(--bad);font-weight:bold;font-family:monospace">' + homeGAA + ' GA/G</div></div>' +
          '</div>';

        html += '<div style="font-size:9px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;font-weight:600">Projected Starters</div>' +
          '<div class="goalie-comparison">' +
          renderGoalieCard(awayG, awayAbbr) +
          renderGoalieCard(homeG, homeAbbr) +
          '</div>';

        // Top shooters — Season/L10 toggle is per-team, independent
        html += '<div class="shooters-grid">' +
          renderShooterCol(awayAbbr, awayAbbr, game.id) +
          renderShooterCol(homeAbbr, homeAbbr, game.id) +
          '</div>';

        html += '</div></div>';
      }

      html += '</div>';
      return html;
    }

    // ========== SHOOTER COLUMNS (standalone, outside loop) ==========

    function getTeamRecentDates(teamAbbrev, n) {
      var skaters = (state.teamStats[teamAbbrev] && state.teamStats[teamAbbrev].skaters) || [];
      var dates = {};
      skaters.forEach(function(sk) {
        var logs = state.playerGameLogs[sk.playerId] || [];
        logs.forEach(function(g) { if (g.gameDate) dates[g.gameDate] = true; });
      });
      return Object.keys(dates).sort().reverse().slice(0, n || 10);
    }

    function getShooterL10Stats(playerId, teamAbbrev) {
      var logs = state.playerGameLogs[playerId];
      if (!logs || logs.length === 0) return null;
      var subset = logs;
      if (teamAbbrev) {
        var teamDates = getTeamRecentDates(teamAbbrev, 10);
        if (teamDates.length >= 5) {
          var dateSet = {};
          teamDates.forEach(function(d) { dateSet[d] = true; });
          var filtered = logs.filter(function(g) { return dateSet[g.gameDate]; });
          if (filtered.length === 0) return null; // player didn't play in team's last 10 (injured/scratched)
          subset = filtered;
        }
      }
      var sog = 0, g = 0, a = 0, pts = 0, toiSecs = 0, toiCount = 0;
      for (var i = 0; i < subset.length; i++) {
        sog += subset[i].shots || 0;
        g += subset[i].goals || 0;
        a += subset[i].assists || 0;
        pts += subset[i].points || 0;
        var t = parseTOI(subset[i].toi);
        if (t > 0) { toiSecs += t; toiCount++; }
      }
      return { sog: sog, g: g, a: a, pts: pts, games: subset.length,
               avgToiSecs: toiCount > 0 ? toiSecs / toiCount : 0 };
    }

    function buildPlayerOddsHTML(playerName) {
      var odds = getPlayerOdds(playerName);
      var html = '<div style="padding:8px 10px;background:var(--inset);border-top:1px solid var(--line2)">';

      function oddsGrid(books, getOver, getUnder, getYes, line, bestOver, bestUnder, bestYes) {
        var active = BOOKS_ORDER.filter(function(bk) { return books[bk]; });
        if (!active.length) return '<div style="color:var(--dim);font-size:10px;padding:2px 0">No data</div>';
        var col = '56px repeat(' + active.length + ', 1fr)';
        var g = '<div style="display:grid;grid-template-columns:' + col + ';gap:3px;font-size:10px">';
        g += '<div></div>';
        active.forEach(function(bk) { g += '<div style="text-align:center;font-size:9px;color:var(--faint);font-weight:700">' + (BOOK_DISPLAY[bk] || bk) + '</div>'; });
        if (getOver) {
          g += '<div style="color:var(--good)">O' + (line != null ? line : '') + '</div>';
          active.forEach(function(bk) {
            var b = books[bk]; var v = getOver(b); var best = v != null && v === bestOver;
            if (v == null) { g += '<div style="text-align:center;color:var(--dim2)">—</div>'; return; }
            var url = buildBetUrl(bk, b && b.over_link, b && b.over_sid);
            var ca = url ? ' onclick="window.copyBetLink(\'' + url.replace(/'/g,"\\'") + '\',\'' + (BOOK_DISPLAY[bk]||bk) + '\',event)" title="Copy ' + (BOOK_DISPLAY[bk]||bk) + ' link" style="text-align:center;cursor:pointer;font-family:monospace;color:' : ' style="text-align:center;font-family:monospace;color:';
            g += '<div' + ca + (best ? 'var(--good)' : 'var(--sub)') + ';font-weight:' + (best ? '700' : '400') + '">' + formatML(v) + '</div>';
          });
        }
        if (getUnder) {
          g += '<div style="color:var(--bad)">U' + (line != null ? line : '') + '</div>';
          active.forEach(function(bk) {
            var b = books[bk]; var v = getUnder(b); var best = v != null && v === bestUnder;
            if (v == null) { g += '<div style="text-align:center;color:var(--dim2)">—</div>'; return; }
            var url = buildBetUrl(bk, b && b.under_link, b && b.under_sid);
            var ca = url ? ' onclick="window.copyBetLink(\'' + url.replace(/'/g,"\\'") + '\',\'' + (BOOK_DISPLAY[bk]||bk) + '\',event)" title="Copy ' + (BOOK_DISPLAY[bk]||bk) + ' link" style="text-align:center;cursor:pointer;font-family:monospace;color:' : ' style="text-align:center;font-family:monospace;color:';
            g += '<div' + ca + (best ? 'var(--good)' : 'var(--sub)') + ';font-weight:' + (best ? '700' : '400') + '">' + formatML(v) + '</div>';
          });
        }
        if (getYes) {
          g += '<div style="color:var(--warn)">Yes</div>';
          active.forEach(function(bk) {
            var b = books[bk]; var v = getYes(b); var best = v != null && v === bestYes;
            if (v == null) { g += '<div style="text-align:center;color:var(--dim2)">—</div>'; return; }
            var url = buildBetUrl(bk, b && b.over_link, b && b.over_sid);
            var ca = url ? ' onclick="window.copyBetLink(\'' + url.replace(/'/g,"\\'") + '\',\'' + (BOOK_DISPLAY[bk]||bk) + '\',event)" title="Copy ' + (BOOK_DISPLAY[bk]||bk) + ' link" style="text-align:center;cursor:pointer;font-family:monospace;color:' : ' style="text-align:center;font-family:monospace;color:';
            g += '<div' + ca + (best ? 'var(--good)' : 'var(--sub)') + ';font-weight:' + (best ? '700' : '400') + '">' + formatML(v) + '</div>';
          });
        }
        g += '</div>';
        return g;
      }

      var hasAny = false;
      // Order: Goal Scorer → Points → Assists → SOG
      if (odds && odds.goalScorer && odds.goalScorer.books) {
        hasAny = true;
        var gbo2 = odds.goalScorer.bestOver;
        html += '<div style="margin-bottom:8px"><div style="font-size:9px;color:var(--faint);font-weight:700;letter-spacing:0.06em;margin-bottom:5px">GOAL SCORER</div>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">';
        BOOKS_ORDER.forEach(function(bk) {
          var b = odds.goalScorer.books[bk];
          if (!b || b.over == null) return;
          var isBest = gbo2 && gbo2.book === bk;
          var betUrl = buildBetUrl(bk, b.over_link, b.over_sid);
          var clickAttr = betUrl ? ' onclick="window.copyBetLink(\'' + betUrl.replace(/'/g,"\\'") + '\',\'' + (BOOK_DISPLAY[bk]||bk) + '\',event)" title="Copy ' + (BOOK_DISPLAY[bk]||bk) + ' bet link"' : '';
          html += '<div' + clickAttr + ' style="padding:4px 9px;border-radius:4px;border:1px solid ' + (isBest ? 'color-mix(in srgb, var(--good) 40%, transparent)' : 'var(--line)') + ';background:' + (isBest ? 'color-mix(in srgb, var(--good) 8%, transparent)' : 'var(--panel)') + ';' + (betUrl ? 'cursor:pointer;' : '') + '">' +
            '<span style="font-size:9px;color:var(--faint)">' + (BOOK_DISPLAY[bk] || bk) + ' </span>' +
            '<span style="font-size:11px;font-weight:700;color:' + (isBest ? 'var(--good)' : 'var(--txt)') + ';font-family:monospace">Yes ' + (b.over > 0 ? '+' : '') + b.over + '</span>' +
            (betUrl ? '<span style="font-size:8px;color:var(--dim);margin-left:4px">⎘</span>' : '') +
            '</div>';
        });
        html += '</div></div>';
      }
      if (odds && odds.pts && odds.pts.books) {
        hasAny = true;
        var pBO = odds.pts.bestOver, pBU = odds.pts.bestUnder;
        html += '<div style="margin-bottom:8px"><div style="font-size:9px;color:var(--faint);font-weight:700;letter-spacing:0.06em;margin-bottom:4px">POINTS</div>';
        html += oddsGrid(odds.pts.books,
          function(b) { return b && b.over  != null ? b.over  : null; },
          function(b) { return b && b.under != null ? b.under : null; },
          null, odds.pts.consensus, pBO && pBO.odds, pBU && pBU.odds, null);
        html += '</div>';
      }
      if (odds && odds.assists && odds.assists.books) {
        hasAny = true;
        var aBO = odds.assists.bestOver, aBU = odds.assists.bestUnder;
        html += '<div style="margin-bottom:8px"><div style="font-size:9px;color:var(--faint);font-weight:700;letter-spacing:0.06em;margin-bottom:4px">ASSISTS</div>';
        html += oddsGrid(odds.assists.books,
          function(b) { return b && b.over  != null ? b.over  : null; },
          function(b) { return b && b.under != null ? b.under : null; },
          null, odds.assists.consensus, aBO && aBO.odds, aBU && aBU.odds, null);
        html += '</div>';
      }
      if (odds && odds.sog && odds.sog.books) {
        hasAny = true;
        var bo = odds.sog.bestOver, bu = odds.sog.bestUnder;
        html += '<div style="margin-bottom:8px"><div style="font-size:9px;color:var(--faint);font-weight:700;letter-spacing:0.06em;margin-bottom:4px">SHOTS ON GOAL</div>';
        html += oddsGrid(odds.sog.books,
          function(b) { return b && b.over  != null ? b.over  : null; },
          function(b) { return b && b.under != null ? b.under : null; },
          null, odds.sog.consensus,
          bo && bo.odds, bu && bu.odds, null);
        html += '</div>';
      }
      if (!hasAny) {
        html += '<div style="color:var(--dim);font-size:10px;text-align:center;padding:4px 0">No props data for this player</div>';
      }
      html += '</div>';
      return html;
    }

    window.togglePlayerOdds = function(pid, playerName, rowId) {
      var panel = document.getElementById('oddspanel-' + rowId);
      if (!panel) return;
      var isOpen = panel.classList.contains('open');
      document.querySelectorAll('.gamelog-inline.open').forEach(function(el) { el.classList.remove('open'); });
      if (!isOpen) {
        var _sk = ((state.teamStats[rowId.split('-').pop()] || {}).skaters || []).filter(function(x) { return x.playerId === pid; })[0];
        panel.innerHTML = injPanelHTML(playerInjury(pid, rowId.split('-').pop(), playerName, _sk && _sk.positionCode)) + buildPlayerOddsHTML(playerName);
        panel.classList.add('open');
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    };

    function renderShooterColContent(teamAbbr, gameId, mode) {
      var allSkaters = (state.teamStats[teamAbbr] && state.teamStats[teamAbbr].skaters) || [];
      var rows;
      if (mode === 'l10' || mode === 'odds') {
        rows = allSkaters
          .map(function(sk) { return { sk: sk, l10: getShooterL10Stats(sk.playerId, teamAbbr) }; })
          .filter(function(d) { return d.l10 !== null; })
          .sort(function(a, b) { return (b.l10.sog || 0) - (a.l10.sog || 0); })
          .slice(0, 12);
      } else {
        rows = allSkaters
          .slice()
          .sort(function(a, b) { return (b.shots || 0) - (a.shots || 0); })
          .slice(0, 12)
          .map(function(sk) { return { sk: sk, l10: null }; });
      }

      var colHtml = '<div style="display:grid;grid-template-columns:1fr 36px 26px 26px 36px 40px;gap:2px;padding:4px 0 4px;font-size:9px;color:var(--faint);font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--line)">' +
        '<span>PLAYER</span><span style="text-align:right">SOG</span><span style="text-align:right">G</span><span style="text-align:right">A</span><span style="text-align:right">PTS</span><span style="text-align:right">TOI</span>' +
        '</div>';

      if (!rows.length) colHtml += '<div style="padding:10px 0;font-size:10px;color:var(--faint)">No ' + teamAbbr + ' games yet this season' + (mode === 'odds' ? '' : ' — switch to Odds for tonight\'s lines') + '</div>';
      for (var s = 0; s < rows.length; s++) {
        var sk = rows[s].sk;
        var l10 = rows[s].l10;
        var pid = sk.playerId;
        var fullName = (sk.firstName && sk.firstName.default ? sk.firstName.default : '') + ' ' + (sk.lastName && sk.lastName.default ? sk.lastName.default : '');
        var name = fullName.trim() || (sk.lastName && sk.lastName.default) || '';
        var pos = sk.positionCode || '';
        var rowId = 'gl-' + pid + '-' + teamAbbr;
        var _p = state.projections.find(function(x) { return x.id === pid; });
        var _icon = _p ? splitIcon(_p.splits) : '';
        var _inj = playerInjury(pid, teamAbbr, name, pos);

        var sogVal, gVal, aVal, ptsVal, toiVal, clickHandler, panelId, panelEl;

        if (mode === 'odds') {
          var pOdds = getPlayerOdds(fullName);
          var sogLine  = pOdds && pOdds.sog        && pOdds.sog.consensus != null   ? pOdds.sog.consensus                  : null;
          var gsYes    = pOdds && pOdds.goalScorer && pOdds.goalScorer.bestOver    ? pOdds.goalScorer.bestOver.odds        : null;
          var asYes    = pOdds && pOdds.assists    && pOdds.assists.bestOver       ? pOdds.assists.bestOver.odds           : null;
          var psYes    = pOdds && pOdds.pts        && pOdds.pts.bestOver           ? pOdds.pts.bestOver.odds               : null;
          var dash = '<span class="shooter-val" style="color:var(--dim2);font-size:10px">—</span>';
          sogVal  = sogLine != null ? '<span class="shooter-val" style="color:var(--accent);font-size:10px">' + sogLine + '</span>' : dash;
          gVal    = gsYes   != null ? '<span class="shooter-val" style="color:var(--warn);font-size:9px">'  + formatML(gsYes)  + '</span>' : dash;
          aVal    = asYes   != null ? '<span class="shooter-val" style="color:var(--accent);font-size:9px">'  + formatML(asYes)  + '</span>' : dash;
          ptsVal  = psYes   != null ? '<span class="shooter-val" style="color:var(--purple);font-size:9px">'  + formatML(psYes)  + '</span>' : dash;
          var l10Toi = getShooterL10Stats(pid);
          toiVal  = (l10Toi && l10Toi.avgToiSecs > 0)
            ? '<span class="shooter-val" style="color:var(--muted);font-size:10px">' + Math.floor(l10Toi.avgToiSecs / 60) + ':' + String(Math.round(l10Toi.avgToiSecs % 60)).padStart(2,'0') + '</span>'
            : dash;
          panelId = 'oddspanel-' + rowId;
          clickHandler = 'togglePlayerOdds(' + pid + ',\'' + fullName.trim().replace(/'/g, '') + '\',\'' + rowId + '\')';
          panelEl = '<div class="gamelog-inline" id="' + panelId + '"></div>';
        } else if (mode === 'l10' && l10) {
          sogVal = '<span class="shooter-val" style="color:var(--warn)">' + l10.sog + '</span>';
          gVal = '<span class="shooter-val" style="color:var(--bad)">' + l10.g + '</span>';
          aVal = '<span class="shooter-val" style="color:var(--accent)">' + l10.a + '</span>';
          ptsVal = '<span class="shooter-val" style="color:var(--warn)">' + l10.pts + '</span>';
          var tm = l10.avgToiSecs > 0 ? Math.floor(l10.avgToiSecs / 60) + ':' + String(Math.round(l10.avgToiSecs % 60)).padStart(2, '0') : '-';
          toiVal = '<span class="shooter-val" style="color:var(--muted);font-size:10px">' + tm + '</span>';
          clickHandler = 'toggleGameLog(' + pid + ',\'' + rowId + '\')';
          panelEl = '<div class="gamelog-inline" id="gamelog-' + rowId + '"></div>';
        } else {
          sogVal = '<span class="shooter-val" style="color:var(--accent)">' + (sk.shots || 0) + '</span>';
          gVal = '<span class="shooter-val" style="color:var(--bad)">' + (sk.goals || 0) + '</span>';
          aVal = '<span class="shooter-val" style="color:var(--accent)">' + (sk.assists || 0) + '</span>';
          ptsVal = '<span class="shooter-val" style="color:var(--warn)">' + (sk.points || 0) + '</span>';
          toiVal = '<span class="shooter-val" style="color:var(--muted);font-size:10px">' + formatTOI(sk.avgTimeOnIcePerGame) + '</span>';
          clickHandler = 'toggleGameLog(' + pid + ',\'' + rowId + '\')';
          panelEl = '<div class="gamelog-inline" id="gamelog-' + rowId + '"></div>';
        }

        colHtml += '<div id="shooter-wrap-' + rowId + '">' +
          '<div class="shooter-row' + (_inj && _inj.sidelined ? ' row-sidelined' : '') + '" id="shooter-' + rowId + '" onclick="' + clickHandler + '">' +
          '<div class="name-cell" style="gap:6px">' + headshot(pid, teamAbbr, name, 24, false) + '<div style="min-width:0"><div class="shooter-name" title="' + name + '">' + name + injBadge(_inj) + _icon + '</div><div class="shooter-pos">' + pos + lineChips(pid, teamAbbr, name, pos) + '</div></div></div>' +
          sogVal + gVal + aVal + ptsVal + toiVal +
          '</div>' +
          panelEl +
          '</div>';
      }
      return colHtml;
    }

    function renderShooterColHeader(teamAbbr, gameId, mode) {
      function btn(label, val, activeColor, activeBg) {
        var active = mode === val;
        return '<button onclick="toggleShooterView(\'' + gameId + '\',\'' + teamAbbr + '\',\'' + val + '\')" style="padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;border:1px solid ' + (active ? activeColor : 'var(--line)') + ';background:' + (active ? activeBg : 'transparent') + ';color:' + (active ? activeColor : 'var(--muted)') + ';cursor:pointer">' + label + '</button>';
      }
      return '<div style="color:var(--accent);font-size:10px;font-weight:700;padding:4px 0 6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">' +
        '<span>' + teamAbbr + ' TOP SHOOTERS</span>' +
        '<div style="display:flex;gap:3px">' +
        btn('Season', 'season', 'color-mix(in srgb, var(--accent) 90%, transparent)',  'color-mix(in srgb, var(--accent) 15%, transparent)') +
        btn('L10',    'l10',    'color-mix(in srgb, var(--warn) 90%, transparent)',   'color-mix(in srgb, var(--warn) 12%, transparent)') +
        btn('Odds',   'odds',   'color-mix(in srgb, var(--purple) 90%, transparent)',  'color-mix(in srgb, var(--purple) 12%, transparent)') +
        '</div>' +
        '</div>';
    }

    function renderShooterCol(teamAbbr, label, gameId) {
      var key = gameId + '-' + teamAbbr;
      var mode = shooterViewMode[key] || 'l10';
      return '<div class="shooters-col" id="shooters-col-' + key + '">' +
        renderShooterColHeader(teamAbbr, gameId, mode) +
        renderShooterColContent(teamAbbr, gameId, mode) +
        '</div>';
    }

    window.toggleShooterView = function(gameId, teamAbbr, mode) {
      var key = gameId + '-' + teamAbbr;
      shooterViewMode[key] = mode;
      var el = document.getElementById('shooters-col-' + key);
      if (!el) return;
      el.innerHTML = renderShooterColHeader(teamAbbr, gameId, mode) +
        renderShooterColContent(teamAbbr, gameId, mode);
    };

    function renderGoalieCard(goalie, team) {
      if (!goalie) {
        return '<div class="goalie-card"><div class="goalie-name">' + team + '</div><p style="color:var(--faint);font-size:10px">No data</p></div>';
      }
      var gaa = goalie.goalsAgainstAvg?.toFixed(2) || goalie.goalsAgainstAverage?.toFixed(2) || '-';
      var sv = goalie.savePctg?.toFixed(3) || goalie.savePercentage?.toFixed(3) || '-';
      var logs = state.goalieGameLogs[goalie.playerId] || [];

      var formHtml = '';
      // Compute quality starts, home/road SV% from game logs
      var qs = 0, qsTotal = 0;
      var homeGA = 0, homeShots = 0, homeGames = 0;
      var roadGA = 0, roadShots = 0, roadGames = 0;
      for (var i = 0; i < logs.length; i++) {
        var gl = logs[i];
        var gaG = gl.goalsAgainst || 0;
        var saG = gl.shotsAgainst || 0;
        if (i < 5) {
          var cls = gaG <= 2 ? 'form-good' : gaG <= 3 ? 'form-ok' : 'form-bad';
          formHtml += '<div class="goalie-form-game ' + cls + '">' + gaG + '</div>';
        }
        if (saG > 20) {
          qsTotal++;
          if ((1 - gaG / saG) >= 0.917) qs++;
        }
        if (gl.homeRoadFlag === 'H') {
          homeGames++; homeGA += gaG; homeShots += saG;
        } else {
          roadGames++; roadGA += gaG; roadShots += saG;
        }
      }
      var qsPct = qsTotal > 0 ? Math.round((qs / qsTotal) * 100) + '%' : '-';
      var homeSV = homeShots > 0 ? (1 - homeGA / homeShots).toFixed(3) : '-';
      var roadSV = roadShots > 0 ? (1 - roadGA / roadShots).toFixed(3) : '-';

      return '<div class="goalie-card">' +
        '<div class="goalie-name name-cell">' + headshot(goalie.playerId, team, fullNameOf(goalie), 34) + '<span>' + (goalie.firstName?.default?.[0] || '') + '. ' + (goalie.lastName?.default || '') + '</span></div>' +
        '<div class="goalie-stats-row">' +
        '<div class="goalie-stat"><div class="goalie-stat-value">' + gaa + '</div><div class="goalie-stat-label">GAA</div></div>' +
        '<div class="goalie-stat"><div class="goalie-stat-value">' + sv + '</div><div class="goalie-stat-label">SV%</div></div>' +
        '<div class="goalie-stat"><div class="goalie-stat-value">' + (goalie.wins || 0) + '-' + (goalie.losses || 0) + '</div><div class="goalie-stat-label">W-L</div></div>' +
        '<div class="goalie-stat"><div class="goalie-stat-value" style="color:var(--good)">' + qsPct + '</div><div class="goalie-stat-label">QS%</div></div>' +
        '</div>' +
        (logs.length > 0 ? '<div style="display:flex;gap:12px;margin-bottom:6px;font-size:9px">' +
          '<span style="color:var(--faint)">H: <span style="color:var(--txt)">' + homeSV + '</span></span>' +
          '<span style="color:var(--faint)">R: <span style="color:var(--txt)">' + roadSV + '</span></span>' +
        '</div>' : '') +
        (formHtml ? '<div style="font-size:8px;color:var(--faint);margin-bottom:3px">L5 GA:</div><div class="goalie-form">' + formHtml + '</div>' : '') +
        '</div>';
    }

    function renderSplits() {
      var significant = [];
      for (var i = 0; i < state.projections.length; i++) {
        var p = state.projections[i];
        if (p.splits && p.splits.home.games >= 4 && p.splits.road.games >= 4) {
          var diff = p.splits.home.ppg - p.splits.road.ppg;
          significant.push({ proj: p, homePPG: p.splits.home.ppg, roadPPG: p.splits.road.ppg, diff: diff });
        }
      }
      significant.sort(function(a, b) { return Math.abs(b.diff) - Math.abs(a.diff); });
      significant = significant.slice(0, 25);

      var html = '<div class="section"><div class="section-header"><div><div class="section-title" style="color:var(--good)">🏠 HOME/ROAD SPLITS</div><div class="section-subtitle">Players with notable venue-based performance differences</div></div></div>';
      
      html += '<div class="splits-header"><span>PLAYER</span><span>MATCHUP</span><span style="text-align:center">HOME PPG</span><span style="text-align:center">ROAD PPG</span><span style="text-align:center">DIFF</span><span style="text-align:center">EDGE</span></div>';
      html += '<div class="scroll-container" style="max-height:350px">';

      for (var j = 0; j < significant.length; j++) {
        var s = significant[j];
        var p = s.proj;
        var diffClass = s.diff > 0.25 ? 'positive' : s.diff < -0.25 ? 'negative' : 'neutral';
        var hasAdv = (p.isHome && s.diff > 0.2) || (!p.isHome && s.diff < -0.2);
        
        var uid = 'splits-' + p.id;
        html += '<div class="il-wrap">' +
          '<div class="splits-row il-row" id="il-row-' + uid + '" onclick="toggleInlineLog(' + p.id + ',\'' + uid + '\')" style="cursor:pointer">' +
          '<span class="nm-trunc" style="font-weight:500" title="' + p.shortName + '">' + p.shortName + '</span>' +
          '<span style="color:var(--muted)">' + p.team + ' ' + (p.isHome ? 'vs' : '@') + ' ' + p.opponent + '</span>' +
          '<span class="split-value" style="text-align:center;color:var(--good)">' + s.homePPG.toFixed(2) + '</span>' +
          '<span class="split-value" style="text-align:center;color:var(--accent)">' + s.roadPPG.toFixed(2) + '</span>' +
          '<span class="split-value ' + diffClass + '" style="text-align:center">' + (s.diff > 0 ? '+' : '') + s.diff.toFixed(2) + '</span>' +
          '<span style="text-align:center;color:' + (hasAdv ? 'var(--good2)' : 'var(--neutral)') + '">' + (hasAdv ? '✓ ADV' : '—') + '</span>' +
          '</div>' +
          '<div class="gamelog-inline" id="il-log-' + uid + '" style="padding-left:12px;padding-right:12px"></div>' +
          '</div>';
      }

      html += '</div></div>';

      // B2B section
      var b2bPlayers = [];
      for (var k = 0; k < state.projections.length; k++) {
        if (state.projections[k].factors.isB2B) b2bPlayers.push(state.projections[k]);
      }

      if (b2bPlayers.length > 0) {
        html += '<div class="section" style="margin-top:12px"><div class="section-header"><div><div class="section-title" style="color:var(--warn)">😴 BACK-TO-BACK FATIGUE</div><div class="section-subtitle">-10% projection adjustment applied</div></div><span class="section-badge" style="background:color-mix(in srgb, var(--warn) 12%, transparent);color:var(--warn)">' + b2bPlayers.length + '</span></div>';
        html += '<div style="padding:12px">';
        for (var m = 0; m < b2bPlayers.length; m++) {
          var bp = b2bPlayers[m];
          html += '<div style="display:inline-block;margin:4px;padding:6px 10px;background:color-mix(in srgb, var(--warn) 10%, transparent);border-radius:4px;font-size:11px">' + bp.shortName + ' <span style="color:var(--muted)">(' + bp.team + ')</span></div>';
        }
        html += '</div></div>';
      }

      return html;
    }

    var dueSort = { col: 'goalDrought', dir: 'desc' };
    var dueSubTab = 'season'; // 'season' | 'hot'

    var linesProp = 'goals'; // 'goals' | 'pts' | 'assists' | 'sog'
    var linesSort = { col: 'l10', dir: 'desc' };

    var playerModalId   = null;
    var playerModalProp = 'goals';

    function buildDueList(filterFn) {
      var due = [];
      for (var d = 0; d < state.projections.length; d++) {
        var dp = state.projections[d];
        if (!dp.gameLogs || dp.gameLogs.length < 5) continue;

        // L6 SOG
        var l6Sog = 0;
        for (var ls = 0; ls < Math.min(6, dp.gameLogs.length); ls++) l6Sog += dp.gameLogs[ls].shots || 0;

        if (!filterFn(dp, l6Sog)) continue;

        // Consecutive goalless games (drought)
        var goalDrought = 0;
        for (var gi = 0; gi < dp.gameLogs.length; gi++) {
          if ((dp.gameLogs[gi].goals || 0) === 0) goalDrought++;
          else break;
        }
        // Consecutive pointless games
        var pointDrought = 0;
        for (var pi2 = 0; pi2 < dp.gameLogs.length; pi2++) {
          if ((dp.gameLogs[pi2].points || 0) === 0) pointDrought++;
          else break;
        }
        // SOG during goal drought
        var droughtShots = 0;
        for (var ds = 0; ds < goalDrought && ds < dp.gameLogs.length; ds++) droughtShots += dp.gameLogs[ds].shots || 0;

        // SOG during point drought (since last point — same window as pointDrought)
        var sogNoPts = 0;
        for (var np = 0; np < pointDrought && np < dp.gameLogs.length; np++) {
          sogNoPts += dp.gameLogs[np].shots || 0;
        }

        // Skip players with no drought at all — they're not "due"
        if (goalDrought === 0 && pointDrought === 0) continue;

        due.push({ proj: dp, goalDrought: goalDrought, pointDrought: pointDrought, droughtShots: droughtShots, sogNoPts: sogNoPts, seasonSog: dp.seasonShots, l6Sog: l6Sog });
      }
      return due;
    }

    function renderDueTable(due) {
      due.sort(function(a, b) {
        var aVal = a[dueSort.col] !== undefined ? a[dueSort.col] : 0;
        var bVal = b[dueSort.col] !== undefined ? b[dueSort.col] : 0;
        return dueSort.dir === 'desc' ? bVal - aVal : aVal - bVal;
      });

      var cols = [
        { key: 'name',         label: 'PLAYER',          sortable: false },
        { key: 'seasonSog',    label: 'SOG (Season)',     sortable: true  },
        { key: 'l6Sog',        label: 'SOG (L6)',         sortable: true  },
        { key: 'goalDrought',  label: 'G-LESS (GP)',      sortable: true  },
        { key: 'droughtShots', label: 'SOG (Drought)',    sortable: true  },
        { key: 'pointDrought', label: 'PTS-LESS (GP)',    sortable: true  },
        { key: 'sogNoPts',     label: 'SOG / 0 PTS',      sortable: true  },
        { key: 'log',          label: 'GAME LOG  G / P',  sortable: false }
      ];

      var gridCols = 'minmax(155px,195px) 80px 70px 90px 90px 100px 80px 1fr';

      function colBtn(col) {

      for (var ch = 0; ch < cols.length; ch++) headerHtml += colBtn(cols[ch]);

      if (due.length === 0) return headerHtml + '<div class="no-data">No players currently qualify</div>';

      var rowsHtml = '';
      for (var du = 0; du < due.length; du++) {

        var dp2 = ditem.proj;

        var logHtml = '<div style="display:flex;gap:3px;align-items:center;flex-wrap:wrap">';
        var showGames = Math.min(10, dp2.gameLogs.length);
        for (var lt = 0; lt < showGames; lt++) {

          logHtml += '<div style="display:flex;flex-direction:column;gap:2px;align-items:center">' +

            '<div style="width:22px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:monospace;background:' + (hasPt ? 'color-mix(in srgb, var(--warn) 20%, transparent)' : 'color-mix(in srgb, var(--neutral) 20%, transparent)') + ';color:' + (hasPt ? 'var(--warn)' : 'var(--neutral2)') + ';border:1px solid ' + (hasPt ? 'color-mix(in srgb, var(--warn) 35%, transparent)' : 'color-mix(in srgb, var(--neutral) 25%, transparent)') + '">' + (hasPt ? lgl.points : '·') + '</div>' +

          '<div class="il-row" id="il-row-' + uid + '" onclick="toggleInlineLog(' + dp2.id + ',\'' + uid + '\')" style="display:grid;grid-template-columns:' + gridCols + ';gap:8px;padding:10px 14px;align-items:center">' +
          '<div class="name-cell">' + headshot(dp2.id, dp2.team, dp2.name, 28) + '<div style="min-width:0"><div class="nm-trunc" style="font-size:12px;font-weight:500;color:var(--txt)" title="' + dp2.shortName + '">' + dp2.shortName + injBadge(dp2.injury) + splitIcon(dp2.splits) + '</div><div style="font-size:10px;color:var(--muted)">' + dp2.team + ' • ' + dp2.position + '</div></div></div>' +
          '<div style="text-align:right;font-family:monospace;font-size:13px;font-weight:700;color:var(--accent)">' + dp2.seasonShots + '</div>' +

          '<div style="text-align:right;font-family:monospace;font-size:15px;font-weight:800;color:' + gDroughtColor + '">' + ditem.goalDrought + '<span style="font-size:10px;font-weight:400;color:var(--faint)"> GP</span></div>' +
          '<div style="text-align:right;font-family:monospace;font-size:13px;font-weight:700;color:var(--muted)">' + ditem.droughtShots + '<span style="font-size:9px;font-weight:400;color:var(--faint)"> SOG</span></div>' +
          '<div style="text-align:right;font-family:monospace;font-size:15px;font-weight:800;color:' + pDroughtColor + '">' + ditem.pointDrought + '<span style="font-size:10px;font-weight:400;color:var(--faint)"> GP</span></div>' +
          '<div style="text-align:right;font-family:monospace;font-size:13px;font-weight:700;color:var(--purple2)">' + ditem.sogNoPts + '<span style="font-size:9px;font-weight:400;color:var(--faint)"> SOG</span></div>' +
          '<div>' + logHtml + '</div>' +
          '</div>' +

          '</div>';
      }
      return headerHtml + '<div class="scroll-container" style="max-height:calc(100vh - 270px)">' + rowsHtml + '</div>';
    }

    function renderStreaks() {
      var seasonDue = buildDueList(function(dp) { return dp.seasonShots >= 100; });
      var hotDue    = buildDueList(function(dp, l6) { return l6 >= 20; });

      var activeList = dueSubTab === 'season' ? seasonDue : hotDue;

      // Sub-tab toggle buttons
      var subTabHtml = '<div style="display:flex;gap:8px;margin-bottom:12px">' +
        '<button onclick="switchDueSubTab(\'season\')" style="padding:5px 14px;border-radius:5px;border:1px solid ' + (dueSubTab === 'season' ? 'color-mix(in srgb, var(--accent) 35%, transparent)' : 'var(--line)') + ';background:' + (dueSubTab === 'season' ? 'color-mix(in srgb, var(--accent) 12%, transparent)' : 'var(--panel)') + ';color:' + (dueSubTab === 'season' ? 'var(--accent)' : 'var(--muted)') + ';cursor:pointer;font-size:11px;font-weight:600">100+ SOG (Season) <span style="opacity:0.6;font-size:10px">(' + seasonDue.length + ')</span></button>' +
        '<button onclick="switchDueSubTab(\'hot\')" style="padding:5px 14px;border-radius:5px;border:1px solid ' + (dueSubTab === 'hot' ? 'color-mix(in srgb, var(--warn) 35%, transparent)' : 'var(--line)') + ';background:' + (dueSubTab === 'hot' ? 'color-mix(in srgb, var(--warn) 10%, transparent)' : 'var(--panel)') + ';color:' + (dueSubTab === 'hot' ? 'var(--warn)' : 'var(--muted)') + ';cursor:pointer;font-size:11px;font-weight:600">20+ SOG (L6) <span style="opacity:0.6;font-size:10px">(' + hotDue.length + ')</span></button>' +
