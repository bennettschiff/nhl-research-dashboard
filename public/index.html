<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>NHL Research Dashboard</title>
  <style>
    /* ── The palette ─────────────────────────────────────────────────────────
       Every color on the page is one of these variables, so a theme is one
       attribute: <html data-theme="light|dark">, set before first paint by the
       script below and flipped by the header toggle (toggleTheme). DARK is the
       original Dusty Slate, value for value; LIGHT is the NFL lab's bright
       card-on-slate look. Inline styles in the script use var(--…) too, and
       translucency is color-mix(in srgb, var(--x) N%, transparent) — never a
       hex with an alpha suffix glued on. */
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #111827; --deep: #111827; --panel: #1a2535; --inset: #0f1923;
      --modal-bg: #0d1520; --modal-card: #111c2d;
      --line: #4a566e; --line2: #3d4f6a; --line-soft: #2a3248;
      --txt: #e2e8f0; --sub: #94a3b8; --muted: #7a8fa8; --faint: #64748b; --faintest: #475569;
      --neutral: #525252; --neutral2: #404040; --neutral3: #737373;
      --accent: #7dd3fc; --good: #4ade80; --good2: #22c55e; --teal: #34d399;
      --bad: #f87171; --bad2: #ef4444; --warn: #fbbf24;
      --purple: #a78bfa; --purple2: #7c3aed; --blue: #60a5fa; --shadow: #000000;
      --dim: #4a566e; --dim2: #3d4f6a; --zebra: rgba(0, 0, 0, 0.12);
      --header-bg: #1a2535; --card-shadow: none;
      --tab-on-bg: color-mix(in srgb, #7dd3fc 14%, transparent); --tab-on-line: color-mix(in srgb, #7dd3fc 35%, transparent); --tab-on-fg: #7dd3fc;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page: #eef2f8; --deep: #f4f6fa; --panel: #ffffff; --inset: #f2f5fa;
      --modal-bg: #eef2f8; --modal-card: #ffffff;
      --line: #d5dde9; --line2: #c3ccda; --line-soft: #e6ebf2;
      --txt: #0f1b2d; --sub: #4a5a72; --muted: #536379; --faint: #6b7a90; --faintest: #94a0b2;
      --neutral: #a3afc0; --neutral2: #c0c8d4; --neutral3: #7d8899;
      --accent: #1f4fb8; --good: #15803d; --good2: #16a34a; --teal: #0f8a63;
      --bad: #d12f2f; --bad2: #dc2626; --warn: #b45309;
      --purple: #7c3aed; --purple2: #6d28d9; --blue: #2563eb; --shadow: #0f1b2d;
      --dim: #8d99ab; --dim2: #a3afc0; --zebra: rgba(15, 27, 45, 0.035);
      --header-bg: rgba(255, 255, 255, 0.88);
      --card-shadow: 0 1px 2px rgba(15, 27, 45, 0.05), 0 6px 22px rgba(15, 27, 45, 0.06);
      --tab-on-bg: #1f4fb8; --tab-on-line: #1f4fb8; --tab-on-fg: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--page); color: var(--txt); min-height: 100vh; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; position: relative; overflow: hidden; }
    .loading-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: block; }
    .loading-inner { position: relative; z-index: 1; text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    .loading-text { color: var(--txt); font-family: monospace; font-size: 12px; letter-spacing: 0.1em; }
    .loading-status { color: var(--sub); font-family: monospace; font-size: 10px; margin-top: 8px; min-height: 14px; }
    .loading-progress-wrap { width: 280px; height: 3px; background: var(--inset); border-radius: 2px; margin: 14px auto 6px; overflow: hidden; border: 1px solid var(--panel); }
    .loading-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--line), var(--accent)); border-radius: 2px; transition: width 0.35s ease; box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 45%, transparent); }
    .loading-eta { font-size: 9px; color: var(--faint); font-family: monospace; letter-spacing: 0.06em; min-height: 13px; margin-top: 4px; }
    header { padding: 12px 16px; background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
    .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
    .title { font-size: 18px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .title-badge { font-size: 9px; padding: 2px 6px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #fff; border-radius: 4px; font-weight: 700; }
    .subtitle { font-size: 10px; color: var(--muted); font-family: monospace; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .refresh-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background-color: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 6px; color: var(--accent); cursor: pointer; font-size: 11px; font-weight: 500; transition: all 0.2s; }
    .theme-btn { display: flex; align-items: center; gap: 5px; padding: 6px 10px; background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 500; }
    .theme-btn:hover { color: var(--txt); border-color: var(--muted); }
    .refresh-btn:hover { background-color: color-mix(in srgb, var(--accent) 20%, transparent); }
    .last-updated { font-size: 9px; color: var(--faint); font-family: monospace; }
    main { padding: 12px; max-width: 1400px; margin: 0 auto; }
    .tab-nav { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { padding: 8px 16px; background-color: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 500; white-space: nowrap; transition: all 0.2s; }
    .tab-btn:hover { background-color: var(--line-soft); color: var(--txt); }
    .tab-btn.active { background-color: var(--tab-on-bg); border-color: var(--tab-on-line); color: var(--tab-on-fg); }
    .date-banner { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px; font-size: 12px; color: var(--txt); }
    .game-count { font-family: monospace; font-size: 11px; color: var(--muted); }
    .section { background-color: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; box-shadow: var(--card-shadow); }
    .section-header { padding: 12px 14px; background-color: var(--deep); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .section-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .section-subtitle { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .section-badge { font-size: 9px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    
    /* Projections Table */
    .proj-header { display: grid; grid-template-columns: 190px 55px 60px 65px 60px 60px 60px 75px 140px; gap: 4px; padding: 8px 12px; background-color: var(--deep); font-size: 9px; color: var(--faint); font-weight: 600; text-transform: uppercase; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); }
    .proj-row { display: grid; grid-template-columns: 190px 55px 60px 65px 60px 60px 60px 75px 140px; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; transition: background-color 0.2s; }
    .proj-row:hover { background-color: color-mix(in srgb, var(--accent) 5%, transparent); }
    .sort-btn { background: none; border: none; color: inherit; cursor: pointer; font-size: 9px; font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 3px; padding: 0; }
    .sort-btn:hover { color: var(--accent); }
    .sort-btn.active { color: var(--accent); }
    .nm-trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .proj-player { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .proj-player-name { font-size: 12px; font-weight: 500; color: var(--txt); display: flex; align-items: center; gap: 6px; }
    .proj-player-meta { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .proj-value { text-align: center; font-family: monospace; font-size: 12px; font-weight: 600; }
    .proj-prob { text-align: center; font-size: 11px; padding: 3px 6px; border-radius: 4px; font-weight: 600; }
    .prob-high { background-color: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
    .prob-medium { background-color: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .prob-low { background-color: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
    .confidence-bar { width: 100%; height: 6px; background-color: var(--line); border-radius: 3px; overflow: hidden; }
    .confidence-fill { height: 100%; border-radius: 3px; }
    .edge-badge { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 4px; font-size: 9px; font-weight: 600; }
    .edge-strong { background-color: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
    .edge-moderate { background-color: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .edge-weak { background-color: color-mix(in srgb, var(--faint) 20%, transparent); color: var(--muted); }
    .factor-tag { display: inline-block; font-size: 9px; padding: 2px 5px; border-radius: 3px; margin: 1px; }
    .factor-positive { background-color: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
    .factor-negative { background-color: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
    .factor-neutral { background-color: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
    

    /* Projections v2 — market filter, model plays, ledger */
    .proj-header.proj-all, .proj-row.proj-all { grid-template-columns: 190px 44px 50px 46px 46px 50px 54px 54px 58px 150px minmax(120px,1fr); min-width: 920px; }
    .proj-header.proj-mkt, .proj-row.proj-mkt { grid-template-columns: 190px 50px 60px 56px 50px 92px 50px 50px 150px minmax(120px,1fr); min-width: 920px; }
    .hscroll { overflow-x: auto; }
    .row-official { background: color-mix(in srgb, var(--good) 5%, transparent); box-shadow: inset 3px 0 0 var(--good); }
    .row-unpriced { opacity: 0.55; }
    .mkt-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .mkt-pill, .mkt-toggle { padding: 5px 12px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; }
    .mkt-pill:hover, .mkt-toggle:hover { color: var(--txt); border-color: var(--muted); }
    .mkt-pill.on { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); }
    .mkt-toggle.on { background: color-mix(in srgb, var(--good) 12%, transparent); border-color: color-mix(in srgb, var(--good) 40%, transparent); color: var(--good); }
    .mkt-toggle.juice.on { background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 40%, transparent); color: var(--warn); }
    .mkt-sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
    .play-badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 4px; letter-spacing: 0.03em; white-space: nowrap; }
    .play-official { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); }
    .play-probation { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
    .play-reason { font-size: 9px; color: var(--faint); }
    .res-badge { display: inline-block; margin-left: 5px; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px; font-family: monospace; }
    .res-win { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
    .res-loss { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
    .res-void { background: color-mix(in srgb, var(--faint) 20%, transparent); color: var(--sub); }
    .plays-cell { display: flex; flex-wrap: wrap; gap: 3px; }
    .inj-badge { display: inline-block; margin-left: 5px; font-size: 8px; font-weight: 800; padding: 1px 4px; border-radius: 3px; letter-spacing: 0.04em; vertical-align: 1px; cursor: help; }
    .inj-out { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
    .inj-dtd { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
    .row-sidelined { opacity: 0.55; }
    .line-chip { display: inline-block; margin-left: 4px; font-size: 8px; font-weight: 800; padding: 0 4px; border-radius: 3px; letter-spacing: 0.03em; line-height: 13px; vertical-align: 1px; cursor: help; color: var(--sub); background: color-mix(in srgb, var(--faint) 16%, transparent); }
    .line-chip.l1 { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
    .line-chip.l2 { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .line-chip.pp1 { color: var(--purple); background: color-mix(in srgb, var(--purple) 16%, transparent); }
    .line-chip.pp2 { color: var(--purple); background: color-mix(in srgb, var(--purple) 7%, transparent); }
    .lines-panel { margin: 4px 0 8px; padding: 6px 10px; border-radius: 5px; font-size: 10px; line-height: 1.6; color: var(--sub); border: 1px solid var(--line); }
    .lines-panel b { color: var(--txt); font-weight: 600; }
    .inj-panel { margin: 4px 0 8px; padding: 7px 10px; border-radius: 5px; font-size: 10px; line-height: 1.5; color: var(--sub); }
    .inj-panel.inj-out, .inj-panel.inj-dtd { border-width: 1px; }
    .inj-panel b { margin-right: 4px; }
    .mini-play { font-size: 9px; padding: 2px 5px; border-radius: 3px; white-space: nowrap; font-weight: 600; }
    .mini-official { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
    .mini-prob { background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--warn); }
    .src-badge { font-size: 9px; margin-left: 8px; padding: 2px 7px; border-radius: 3px; font-weight: 500; }
    .src-tracked { background: color-mix(in srgb, var(--purple) 12%, transparent); border: 1px solid color-mix(in srgb, var(--purple) 30%, transparent); color: var(--purple); }
    .src-live { background: color-mix(in srgb, var(--faint) 15%, transparent); border: 1px solid var(--line); color: var(--sub); }
    .src-odds { background: color-mix(in srgb, var(--good) 10%, transparent); border: 1px solid color-mix(in srgb, var(--good) 25%, transparent); color: var(--good); }
    .src-err { background: color-mix(in srgb, var(--bad) 10%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 25%, transparent); color: var(--bad); }
    .credits { font-size: 10px; font-family: monospace; color: var(--sub); text-align: right; line-height: 1.35; }
    .credits b { color: var(--txt); font-weight: 600; }
    .credits.low b { color: var(--bad); }
    /* Header status read + Model Refresh (labStatusHtml / openLabRefresh). Between
       the title and the buttons on a wide screen; its own row under them below 1180px. */
    .lab-status { display: flex; gap: 18px; margin-left: auto; margin-right: 12px; white-space: nowrap; }
    .lab-status .credits { line-height: 1.5; }
    .lab-new { margin-left: 6px; font-size: 9px; padding: 1px 5px; border-radius: 3px; border: none; cursor: pointer; font-weight: 600; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
    .lab-btn { position: relative; }
    .lab-note { position: absolute; top: calc(100% + 6px); right: 0; width: 260px; padding: 8px 12px; font-size: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px color-mix(in srgb, var(--shadow) 30%, transparent); z-index: 120; }
    .lab-overlay { position: fixed; inset: 0; z-index: 2000; background: color-mix(in srgb, var(--shadow) 35%, transparent); display: flex; align-items: flex-start; justify-content: center; padding: 72px 16px 16px; }
    .lab-dialog { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: 0 12px 32px color-mix(in srgb, var(--shadow) 35%, transparent); }
    .lab-dialog-title { font-size: 13px; font-weight: 600; color: var(--txt); margin-bottom: 6px; }
    .lab-dialog-text { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
    .lab-dialog-text:empty { display: none; }
    .lab-dialog input { width: 100%; padding: 6px 10px; margin-bottom: 10px; background: var(--page); border: 1px solid var(--line); border-radius: 5px; color: var(--txt); font-size: 12px; outline: none; }
    .lab-dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .lab-dialog-actions .refresh-btn:disabled { opacity: 0.5; cursor: default; }
    @media (max-width: 1180px) {
      .header-content { flex-wrap: wrap; row-gap: 6px; }
      .lab-status { order: 3; width: 100%; margin: 0; justify-content: flex-end; }
    }
    @media (max-width: 640px) {
      .lab-status { justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; }
      .lab-status .credits { text-align: left; font-size: 9px; }
    }

    /* Tracker */
    .trk-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; padding: 12px; }
    .trk-card { background: var(--deep); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .trk-card h4 { font-size: 12px; color: var(--accent); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .trk-line { display: flex; justify-content: space-between; font-size: 11px; font-family: monospace; padding: 2px 0; color: var(--txt); }
    .trk-line span:first-child { color: var(--muted); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .trk-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .trk-table th { text-align: left; font-size: 9px; color: var(--faint); text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--deep); position: sticky; top: 0; }
    .trk-table td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); font-family: monospace; color: var(--txt); white-space: nowrap; }
    .trk-table td.name { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .pos { color: var(--good); } .neg { color: var(--bad); } .dim { color: var(--faint); } .amb { color: var(--warn); }
    .trk-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; padding: 12px; }
    .trk-hero-tile { background: var(--deep); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
    .trk-hero-tile.emph { border-color: color-mix(in srgb, var(--purple) 45%, transparent); background: color-mix(in srgb, var(--purple) 6%, transparent); }
    .trk-label { font-size: 10px; color: var(--sub); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
    .trk-hint { font-size: 10px; color: var(--faint); margin: 2px 0 8px; }
    .trk-big { font-family: monospace; font-size: 26px; font-weight: 700; line-height: 1.1; margin: 4px 0 4px; }
    .trk-sub { font-size: 11px; color: var(--sub); margin-top: 3px; font-family: monospace; }
    .trk-sub b { color: var(--txt); }
    .trk-sub .pos { color: var(--good); } .trk-sub .neg { color: var(--bad); }
    .trk-mix { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; font-family: monospace; margin-top: 6px; }
    .trk-mix span { color: var(--sub); }
    .trk-early { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); border-radius: 3px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
    .trk-spark { display: block; width: 100%; height: 38px; margin-top: 8px; }
    .trk-mkt { background: var(--deep); border: 1px solid var(--line); border-top-width: 3px; border-radius: 8px; padding: 10px 12px; }
    .trk-mkt.up { border-top-color: var(--good); } .trk-mkt.down { border-top-color: var(--bad); }
    .trk-mkt h4 { font-size: 12px; color: var(--txt); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .trk-rule { border-top: 1px solid var(--line-soft); margin: 9px 0 5px; }
    .trk-cap { font-size: 11px; color: var(--sub); line-height: 1.45; margin: 0 0 8px; }
    .trk-cap b { color: var(--txt); font-weight: 600; }
    .trk-pills { display: flex; gap: 4px; flex-wrap: wrap; }
    .trk-pills .mkt-pill { padding: 3px 9px; font-size: 10px; }
    .trk-split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; padding: 0 12px 12px; }

  <script>
    // ========== STATE ==========
    const state = {

      trkSort: { day: { col: 'date', dir: 'desc' }, brk: { col: 'gU', dir: 'desc' }, picks: { col: 'date', dir: 'desc' } },

    const LEAGUE_AVG = { goalsPerGame: 3.1, shotsPerGame: 30.5 };

    // Returns 🏠 if strong home scorer, 🥷 if strong road scorer, '' otherwise
    function splitIcon(splits, threshold) {
      threshold = threshold || 0.2;
      if (!splits || splits.home.games < 3 || splits.road.games < 3) return '';
      var diff = splits.home.ppg - splits.road.ppg;
      if (diff >= threshold) return '<span title="Home scorer advantage" style="font-size:11px;margin-left:3px">🏠</span>';
      if (diff <= -threshold) return '<span title="Road scorer advantage" style="font-size:11px;margin-left:3px">🥷</span>';
      return '';
    }

    // ========== API ==========
    async function fetchAPI(endpoint) {
      const response = await fetch('/api' + endpoint);
      if (!response.ok) throw new Error('API error: ' + response.status);
      return response.json();
    }

    async function fetchTodaysGames() {
      const data = await fetchAPI('/schedule/now');
      const now = new Date();
      const today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      const day = data.gameWeek?.find(function(d) { return d.date === today; }) || data.gameWeek?.[0];
      // gameDate lives on the DAY, not the game — without stamping it, every
      // isBackToBack(team, game.gameDate) call got null and B2B never fired.
      return (day?.games || []).map(function(g) { g.gameDate = g.gameDate || day.date; return g; });
    }

    async function fetchStandings() {
      const data = await fetchAPI('/standings/now');
      const standings = {};
      (data.standings || []).forEach(function(team) {
        standings[team.teamAbbrev?.default] = {
          wins: team.wins || 0,
          losses: team.losses || 0,
          gamesPlayed: team.gamesPlayed || 0,
          goalsFor: team.goalFor || 0,
          goalsAgainst: team.goalAgainst || 0,
          l10Wins: team.l10Wins || 0,
          l10Losses: team.l10Losses || 0,
          // Home/road defensive splits for venue-aware opponent adjustment
          homeGoalsAgainst: team.homeGoalsAgainst || 0,
          homeGamesPlayed: team.homeGamesPlayed || 0,
          roadGoalsAgainst: team.roadGoalsAgainst || 0,
          roadGamesPlayed: team.roadGamesPlayed || 0
        };
      });
      return standings;
    }

    // ========== SEASON SCOPE ==========
    // Everything the page SHOWS is this regular season only. On 2026-10-01 a
    // player with no 2026-27 games showed his 2025-26 PLAYOFF log: /game-log/now
    // resolves to the player's latest season AND game type, so every call below
    // names the season and gameType 2 explicitly. Last season reaches the page
    // only as the model's hidden prior (lib/nhl-model.js), never as a number shown.
    var _priorSeasonTotals = null;
    var _teamTotals = {};

    function priorSeasonId() {
      var start = parseInt(getSeasonId().substring(0, 4), 10) - 1;
      return String(start) + String(start + 1);
    }

    // Last regular season, per skater: the model's fading prior + its league context.
    async function fetchPriorSeasonTotals() {
      if (_priorSeasonTotals) return _priorSeasonTotals;
      var exp = encodeURIComponent('seasonId=' + priorSeasonId() + ' and gameTypeId=2');
      var out = { skaters: {}, goalies: {} };
      try {
        var sk = await fetchLegacyAPI('/skater/summary?limit=-1&cayenneExp=' + exp);
        (sk.data || []).forEach(function(r) {
          out.skaters[r.playerId] = { gp: r.gamesPlayed || 0, toi: (r.timeOnIcePerGame || 0) * (r.gamesPlayed || 0),
            shots: r.shots || 0, goals: r.goals || 0, assists: r.assists || 0, points: r.points || 0, pos: r.positionCode };
        });
        // PP minutes (v2.4: the model weights them)
        var ti = await fetchLegacyAPI('/skater/timeonice?limit=-1&cayenneExp=' + exp);
        (ti.data || []).forEach(function(r) { if (out.skaters[r.playerId]) out.skaters[r.playerId].ppToi = r.ppTimeOnIce || 0; });
        var gk = await fetchLegacyAPI('/goalie/summary?limit=-1&cayenneExp=' + exp);
        (gk.data || []).forEach(function(r) { out.goalies[r.playerId] = { gp: r.gamesPlayed || 0 }; });
      } catch (err) {
        console.warn('Prior-season totals unavailable:', err.message);
      }
      _priorSeasonTotals = out;
      return out;
    }

    function teamAbbrevFromName(full) {
      var k = String(full || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      if (k === 'utah mammoth') return 'UTA';
      return NHL_TEAM_ABBREV[k] || null;
    }

    // { ABBR: {gp, ga, sa} } for one regular season — the model's opponent context
    async function fetchTeamTotals(seasonId) {
      if (_teamTotals[seasonId]) return _teamTotals[seasonId];
      var out = {};
      try {
        var d = await fetchLegacyAPI('/team/summary?limit=-1&cayenneExp=' + encodeURIComponent('seasonId=' + seasonId + ' and gameTypeId=2'));
        (d.data || []).forEach(function(r) {
          var ab = teamAbbrevFromName(r.teamFullName);
          if (!ab) return;
          var gp = r.gamesPlayed || 0;
          out[ab] = { gp: gp, ga: r.goalsAgainst || 0, sa: Math.round((r.shotsAgainstPerGame || 0) * gp) };
        });
      } catch (err) {
        console.warn('Team totals unavailable (' + seasonId + '):', err.message);
      }
      _teamTotals[seasonId] = out;
      return out;
    }

    function zeroSkater(r) {
      return { playerId: r.id, headshot: r.headshot, firstName: r.firstName, lastName: r.lastName,
        positionCode: r.positionCode, gamesPlayed: 0, goals: 0, assists: 0, points: 0, plusMinus: 0,
        penaltyMinutes: 0, powerPlayGoals: 0, shorthandedGoals: 0, gameWinningGoals: 0, shots: 0,
        shootingPctg: 0, avgTimeOnIcePerGame: 0 };

    function zeroGoalie(r) {

    // Run fn over items with at most `limit` requests in flight.
    async function pool(items, limit, fn) {
      var i = 0;
      async function worker() { while (i < items.length) { var k = i++; await fn(items[k], k); } }
      var ws = [];
      for (var w = 0; w < Math.min(limit, items.length); w++) ws.push(worker());
      await Promise.all(ws);
    }

    // Derive season ID from already-loaded game IDs (format: 2024020001 → start year 2024 → "20242025")
    // This is more reliable than new Date() which can be wrong when running under test environments
    function getSeasonId() {
      if (state.games && state.games.length > 0) {
        var gid = String(state.games[0].id || state.games[0].gameId || '');
        if (gid.length >= 4) {
          var startYear = parseInt(gid.substring(0, 4), 10);
          if (startYear >= 2000 && startYear <= 2040) {
            return String(startYear) + String(startYear + 1);
          }
        }
      }
      // Fallback: compute from actual system date
      var now = new Date();
      var yr = now.getFullYear();
      var mo = now.getMonth() + 1;
      var startYear = mo >= 10 ? yr : yr - 1;
      return String(startYear) + String(startYear + 1);
    }

    // ========== ODDS HELPERS ==========
    var BOOK_DISPLAY = { draftkings: 'DK', fanduel: 'FD', fanatics: 'FAN', hardrockbet: 'HRock' };
    var BOOKS_ORDER  = ['draftkings', 'fanduel', 'fanatics', 'hardrockbet'];

    function formatML(odds) {
      if (odds == null) return '—';
      return (odds > 0 ? '+' : '') + odds;
    }

    function americanToDecimal(odds) {
      if (!odds) return 0;
      return odds > 0 ? 1 + odds / 100 : 1 + 100 / Math.abs(odds);
    }

    // Best over = lowest line; on tie, best (highest) decimal odds
    // Best under = highest line; on tie, best (highest) decimal odds
    function computeBestLines(books) {
      var bestOver = null, bestUnder = null;
      Object.keys(books).forEach(function(bk) {
        var b = books[bk];
        if (!b || b.line == null) return;
        if (b.over != null) {
          if (!bestOver || b.line < bestOver.line ||
              (b.line === bestOver.line && americanToDecimal(b.over) > americanToDecimal(bestOver.odds))) {
            bestOver = { line: b.line, odds: b.over, book: bk };
          }
        }
        if (b.under != null) {
          if (!bestUnder || b.line > bestUnder.line ||
              (b.line === bestUnder.line && americanToDecimal(b.under) > americanToDecimal(bestUnder.odds))) {
            bestUnder = { line: b.line, odds: b.under, book: bk };
          }
        }
      });
      return { bestOver: bestOver, bestUnder: bestUnder };
    }

    // Most common line across books
    function consensusLine(books) {
      var counts = {};
      Object.keys(books).forEach(function(bk) {
        var b = books[bk];
        if (!b || b.line == null) return;
        counts[b.line] = (counts[b.line] || 0) + 1;
      });
      var best = null, bestCount = 0;
      Object.keys(counts).forEach(function(line) {
        if (counts[line] > bestCount) { bestCount = counts[line]; best = parseFloat(line); }
      });
      return best;
    }

    // Best goal-scorer price = highest decimal (best payout)
    function computeBestPrice(books) {
      var best = null;
      Object.keys(books).forEach(function(bk) {
        var b = books[bk];
        if (!b || b.yes == null) return;
        if (!best || americanToDecimal(b.yes) > americanToDecimal(best.odds)) {
          best = { odds: b.yes, book: bk };
        }
      });
      return best;
    }

    var ODDS_FEED_URL = (NHL_CFG.supabaseUrl || '') + '/rest/v1/nhl_event_odds';

    function localDateStr(d) {

    async function fetchStoredOdds(dateStr) {

    // Local-dev fallback only (server.js /odds-api proxy, 4h file cache): used
    // when the feed has nothing for today, e.g. before the morning pull. /events
    // lists every upcoming NHL game (30+), so filter to today's slate first —
    // without it one page load priced the next ~10 days at ≤8 credits a game.
    async function fetchLiveOdds(dateStr) {
      var events = await fetchOddsAPI('/v4/sports/icehockey_nhl/events');
      var todayEvents = (events || []).filter(function(ev) {
        return localDateStr(new Date(ev.commence_time)) === dateStr;
      });
      console.log('[Props] live fetch for', todayEvents.length, 'of', (events || []).length, 'listed events');
      var boards = [];
      // Sequential with delay to avoid rate-limit 429s
      for (var _ei = 0; _ei < todayEvents.length; _ei++) {
        var _ev = todayEvents[_ei];
        if (_ei > 0) await new Promise(function(r) { setTimeout(r, 300); });
        try {
          boards.push(await fetchOddsAPI(
            '/v4/sports/icehockey_nhl/events/' + _ev.id +
            '/odds?markets=player_shots_on_goal,player_shots_on_goal_alternate,player_goals,player_goal_scorer_anytime,player_assists,player_assists_alternate,player_points,player_points_alternate&oddsFormat=american&bookmakers=draftkings,fanduel,fanatics,hardrockbet&includeLinks=true&includeSids=true'

    // Fold one event's /events/{id}/odds response into propResult (keyed by player name)
    function ingestEventOdds(evOdds, propResult) {
      if (!evOdds || !evOdds.bookmakers) return;

      evOdds.bookmakers.forEach(function(bk) {
        var bookKey = bk.key;
        (bk.markets || []).forEach(function(market) {
          var mKey = market.key;
          // Group outcomes by player name via description field
          var byPlayer = {};
          (market.outcomes || []).forEach(function(o) {
            var pName = (o.description || o.name || '').toLowerCase().trim();
            if (!pName || pName === 'over' || pName === 'under' || pName === 'yes' || pName === 'no') return;
            if (!byPlayer[pName]) byPlayer[pName] = [];
            byPlayer[pName].push(o);
          });

          Object.keys(byPlayer).forEach(function(pName) {
            if (!propResult[pName]) propResult[pName] = {};
            var outs = byPlayer[pName];

            if (mKey === 'player_shots_on_goal') {
              if (!propResult[pName].sog) propResult[pName].sog = { books: {} };
              var sogEntry = {};
              outs.forEach(function(o) {
                if (o.name === 'Over')  { sogEntry.line = o.point; sogEntry.over  = o.price; sogEntry.over_link  = o.link || null; sogEntry.over_sid  = o.sid || null; }
                if (o.name === 'Under') { sogEntry.line = o.point; sogEntry.under = o.price; sogEntry.under_link = o.link || null; sogEntry.under_sid = o.sid || null; }
              });
              propResult[pName].sog.books[bookKey] = sogEntry;
            } else if (mKey === 'player_shots_on_goal_alternate') {
              // Store all lines; resolve to consensus line in post-processing
              if (!propResult[pName]._sogAlts) propResult[pName]._sogAlts = {};
              if (!propResult[pName]._sogAlts[bookKey]) propResult[pName]._sogAlts[bookKey] = {};
              outs.forEach(function(o) {
                if (o.point == null) return;
                if (!propResult[pName]._sogAlts[bookKey][o.point]) propResult[pName]._sogAlts[bookKey][o.point] = {};
                if (o.name === 'Over')  propResult[pName]._sogAlts[bookKey][o.point].over  = o.price;
                if (o.name === 'Under') propResult[pName]._sogAlts[bookKey][o.point].under = o.price;
              });
            } else if (mKey === 'player_goals') {
              if (!propResult[pName].goalScorer) propResult[pName].goalScorer = { books: {} };
              var gsEntry = {};
              outs.forEach(function(o) {
                if (o.name === 'Over')  { gsEntry.line = o.point; gsEntry.over  = o.price; gsEntry.over_link  = o.link || null; gsEntry.over_sid  = o.sid || null; }
                if (o.name === 'Under') { gsEntry.line = o.point; gsEntry.under = o.price; gsEntry.under_link = o.link || null; gsEntry.under_sid = o.sid || null; }
              });
              propResult[pName].goalScorer.books[bookKey] = gsEntry;
            } else if (mKey === 'player_goal_scorer_anytime') {
              // DK/FAN use Yes/No format — map Yes price → over, set line:0.5 so computeBestLines includes it
              if (!propResult[pName].goalScorer) propResult[pName].goalScorer = { books: {} };
              if (!propResult[pName].goalScorer.books[bookKey]) propResult[pName].goalScorer.books[bookKey] = {};
              outs.forEach(function(o) {
                if (o.name === 'Yes') {
                  propResult[pName].goalScorer.books[bookKey].over      = o.price;
                  propResult[pName].goalScorer.books[bookKey].line      = 0.5;
                  propResult[pName].goalScorer.books[bookKey].over_link = o.link || null;
                  propResult[pName].goalScorer.books[bookKey].over_sid  = o.sid  || null;
                }
              });
            } else if (mKey === 'player_assists') {
              if (!propResult[pName].assists) propResult[pName].assists = { books: {} };
              var asEntry = {};
              outs.forEach(function(o) {
                if (o.name === 'Over')  { asEntry.line = o.point; asEntry.over  = o.price; asEntry.over_link  = o.link || null; asEntry.over_sid  = o.sid || null; }
                if (o.name === 'Under') { asEntry.line = o.point; asEntry.under = o.price; asEntry.under_link = o.link || null; asEntry.under_sid = o.sid || null; }
              });
              propResult[pName].assists.books[bookKey] = asEntry;
            } else if (mKey === 'player_assists_alternate') {
              if (!propResult[pName].assists) propResult[pName].assists = { books: {} };
              if (!propResult[pName].assists.books[bookKey]) {
                var aaEntry = {};
                outs.forEach(function(o) {
                  if (o.point === 0.5) {
                    if (o.name === 'Over')  { aaEntry.line = 0.5; aaEntry.over  = o.price; }
                    if (o.name === 'Under') { aaEntry.line = 0.5; aaEntry.under = o.price; }
                  }
                });
                if (aaEntry.over != null) propResult[pName].assists.books[bookKey] = aaEntry;
              }
            } else if (mKey === 'player_points') {
              if (!propResult[pName].pts) propResult[pName].pts = { books: {} };
              var psEntry = {};
              outs.forEach(function(o) {
                if (o.name === 'Over')  { psEntry.line = o.point; psEntry.over  = o.price; psEntry.over_link  = o.link || null; psEntry.over_sid  = o.sid || null; }
                if (o.name === 'Under') { psEntry.line = o.point; psEntry.under = o.price; psEntry.under_link = o.link || null; psEntry.under_sid = o.sid || null; }
              });
              propResult[pName].pts.books[bookKey] = psEntry;
            } else if (mKey === 'player_points_alternate') {
              // Only take the 0.5 line; don't overwrite if player_points already populated this book
              if (!propResult[pName].pts) propResult[pName].pts = { books: {} };
              if (!propResult[pName].pts.books[bookKey]) {
                var paEntry = {};
                outs.forEach(function(o) {
                  if (o.point === 0.5) {
                    if (o.name === 'Over')  { paEntry.line = 0.5; paEntry.over  = o.price; }
                    if (o.name === 'Under') { paEntry.line = 0.5; paEntry.under = o.price; }
                  }
                });
                if (paEntry.over != null) propResult[pName].pts.books[bookKey] = paEntry;
              }
            }
          });
        });
      });
    }

    // Post-process: best lines & best prices
    function finalizeProps(propResult) {
      Object.keys(propResult).forEach(function(name) {
        var p = propResult[name];
        if (p.sog || p._sogAlts) {
          if (!p.sog) p.sog = { books: {} };
          // Fill in books that only have alternate lines using consensus from direct-line books
          if (p._sogAlts) {
            var directConsensus = consensusLine(p.sog.books);
            Object.keys(p._sogAlts).forEach(function(bk) {
              if (p.sog.books[bk]) return; // already have direct line
              var alts = p._sogAlts[bk];
              // Try consensus line first, then closest available
              var targetLine = directConsensus;
              if (targetLine == null || !alts[targetLine]) {
                var lines = Object.keys(alts).map(Number).sort(function(a,b){return a-b;});
                targetLine = lines[Math.floor(lines.length / 2)] || lines[0]; // median
              }
              if (targetLine != null && alts[targetLine]) {
                p.sog.books[bk] = { line: targetLine, over: alts[targetLine].over, under: alts[targetLine].under };
              }
            });
            delete p._sogAlts;
          }
          var bl = computeBestLines(p.sog.books);
          p.sog.bestOver  = bl.bestOver;
          p.sog.bestUnder = bl.bestUnder;
          p.sog.consensus = consensusLine(p.sog.books);
        }
        if (p.goalScorer) {
          var gb = computeBestLines(p.goalScorer.books);
          p.goalScorer.bestOver = gb.bestOver; p.goalScorer.bestUnder = gb.bestUnder;
          p.goalScorer.consensus = consensusLine(p.goalScorer.books);
        }
        if (p.assists) {
          var ab = computeBestLines(p.assists.books);
          p.assists.bestOver = ab.bestOver; p.assists.bestUnder = ab.bestUnder;
          p.assists.consensus = consensusLine(p.assists.books);
        }
        if (p.pts) {
          var pb = computeBestLines(p.pts.books);
          p.pts.bestOver = pb.bestOver; p.pts.bestUnder = pb.bestUnder;
          p.pts.consensus = consensusLine(p.pts.books);
        }
      });
    }

    async function fetchOddsData() {
      state.oddsLoaded = false;
      state.oddsError = null;
      var today = localDateStr(new Date());
      try {
        var boards = [];

          boards = await fetchStoredOdds(today);

          console.warn('Odds feed unavailable:', feedErr.message);
        }
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!boards.length && isLocal) boards = await fetchLiveOdds(today);

        state.oddsBoards = boards;
        var propResult = {};
        boards.forEach(function(b) { ingestEventOdds(b, propResult); });
        finalizeProps(propResult);
        state.oddsData = propResult;
        state.oddsLoaded = true;
        console.log('Player props loaded for', Object.keys(propResult).length, 'players from', boards.length, 'games');
      } catch (err) {
        state.oddsError  = err.message;
        state.oddsLoaded = true;
        console.warn('Odds data unavailable:', err.message);
      }
    }

    // Convert American odds to implied probability (vig-inclusive)
    function impliedProb(americanOdds) {
      if (!americanOdds) return null;
      if (americanOdds > 0) return 100 / (americanOdds + 100);
      return Math.abs(americanOdds) / (Math.abs(americanOdds) + 100);
    }

    // Look up odds for a player by full name — falls back to last-name scan
    function getPlayerOdds(fullName) {
      var key = (fullName || '').toLowerCase().trim();
      if (state.oddsData[key]) return state.oddsData[key];
      var parts = key.split(' ');
      var last = parts[parts.length - 1];
      for (var k in state.oddsData) {
        if (k.split(' ').pop() === last) return state.oddsData[k];
      }
      return null;
    }

    // ========== ANALYSIS ==========
    // parseTOI: game-log toi strings are "MM:SS" — returns seconds
    function parseTOI(toi) {
      if (!toi || toi === '-') return 0;
      var parts = String(toi).split(':');
      if (parts.length === 1) return parseFloat(parts[0]) || 0; // bare seconds
      return parseInt(parts[0] || 0) * 60 + parseInt(parts[1] || 0);
    }

    // formatTOI: avgTimeOnIcePerGame is raw seconds (float) from the API — converts to "MM:SS"
    function formatTOI(secs) {
      if (!secs || isNaN(parseFloat(secs))) return '-';
      var s = Math.round(parseFloat(secs));
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function calculateRecentForm(gameLogs, stat, numGames) {
      if (!gameLogs || gameLogs.length === 0) return null;
      var recent = gameLogs.slice(0, Math.min(numGames || 10, gameLogs.length));
      var total = 0;
      for (var i = 0; i < recent.length; i++) { total += recent[i][stat] || 0; }
      return { total: total, avg: total / recent.length, games: recent.length };
    }

    function calculateHomeRoadSplits(gameLogs) {
      if (!gameLogs || gameLogs.length === 0) return null;
      var home = { games: 0, goals: 0, assists: 0, points: 0, shots: 0 };
      var road = { games: 0, goals: 0, assists: 0, points: 0, shots: 0 };
      for (var i = 0; i < gameLogs.length; i++) {
        var g = gameLogs[i];
        var target = g.homeRoadFlag === 'H' ? home : road;
        target.games++;
        target.goals += g.goals || 0;
        target.assists += g.assists || 0;
        target.points += g.points || 0;
        target.shots += g.shots || 0;
      }
      return {
        home: { games: home.games, goals: home.goals, points: home.points, shots: home.shots, ppg: home.games > 0 ? home.points / home.games : 0, spg: home.games > 0 ? home.shots / home.games : 0 },
        road: { games: road.games, goals: road.goals, points: road.points, shots: road.shots, ppg: road.games > 0 ? road.points / road.games : 0, spg: road.games > 0 ? road.shots / road.games : 0 }
      };
    }

    function detectStreak(gameLogs, stat) {
      if (!gameLogs || gameLogs.length === 0) return { type: 'none', length: 0 };
      var length = 0;
      var firstVal = gameLogs[0][stat] || 0;
      var hasIt = firstVal >= 1;
      for (var i = 0; i < gameLogs.length; i++) {
        var val = gameLogs[i][stat] || 0;
        if ((val >= 1) === hasIt) { length++; } else { break; }

      return { type: 'none', length: 0 };
    }

    // ========== MODEL (lib/nhl-model.js — the same file the ledger runs) ==========

    async function fetchInjuries() {

    // ── Line combos: ESPN's team depth charts (display only) ─────────────────
    // site.api.espn.com …/teams/{slug}/depthcharts (no key) via the /espn-api
    // proxy — ESPN's CDN sends the CORS header only on some copies. Forward
    // lines (rank in LW/C/RW = line), D pairs, PP1/PP2. ESPN re-posts each team's
    // last-game deployment, so the model doesn't read this: it ranks PP units
    // from NHL PP minutes itself (M.ppRoles, v2.4). The PP chip shows that role.
    var ESPN_SLUG = { LAK: 'la', NJD: 'nj', SJS: 'sj', TBL: 'tb', UTA: 'utah' };
    function linesFromEspn(json) {
      var charts = (json && json.depthchart) || [], out = { by: {}, fwd: [], def: [], pp: [[], []] };
      var dflt = charts.filter(function(d) { return /default/i.test(d.name); })[0] || charts[0];
      var pp = charts.filter(function(d) { return /power/i.test(d.name); })[0];
      function active(a) { var i = (a.injuries || [])[0]; return !i || /active|day/i.test(i.status || ''); }
      function put(name, grp, k, v) { var key = M.normName(name) + '|' + grp; (out.by[key] = out.by[key] || {})[k] = v; }
      if (dflt) Object.keys(dflt.positions || {}).forEach(function(slot) {

          put(a.displayName, grp, 'slot', slot.toUpperCase());
          if (!unit) return;

      skaters.forEach(function(sk) {
        var dressed3 = false;
        (state.playerGameLogs[sk.playerId] || []).forEach(function(g) {
          var i = dates.indexOf(g.gameDate), toi = parseTOI(g.toi);
          if (i < 0 || (g.teamAbbrev && g.teamAbbrev !== team) || !(toi > 0)) return;
          lineups[i].push({ id: sk.playerId, pos: sk.positionCode, toi: toi });
          if (i < 3) dressed3 = true;
        });
        var lr = ledger[sk.playerId + ':points'];
        var inj = injuryOf(team, fullNameOf(sk).trim(), sk.positionCode, lr);
        if (!(inj && inj.sidelined) && (dressed3 || !dates.length)) dressing[sk.playerId] = true;
      });
      return { out: M.lineupOut(lineups, dressing), dressing: dressing };
    }

    // Per-game PP TOI ('playerId:gameId' → sec) for the last ~5 weeks: the NHL
    // game log has no PP split, and v2.4 ranks PP units off recent PP minutes.
    // 12-day windows keep each query under the legacy API's 10k-row cap.
    async function fetchRecentPpToi() {
      var out = {}, today = new Date(), wins = [];
      for (var k = 3; k >= 1; k--) {
        var a = new Date(today), b = new Date(today);
        a.setDate(a.getDate() - 12 * k); b.setDate(b.getDate() - 12 * (k - 1));
        wins.push([localDateStr(a), localDateStr(b)]);
      }
      await Promise.all(wins.map(async function(w) {
        try {
          var exp = 'seasonId=' + getSeasonId() + ' and gameTypeId=2 and gameDate>="' + w[0] + '" and gameDate<"' + w[1] + '"';
          var d = await fetchLegacyAPI('/skater/timeonice?isAggregate=false&isGame=true&limit=-1&cayenneExp=' + encodeURIComponent(exp));
          (d.data || []).forEach(function(r) { out[r.playerId + ':' + r.gameId] = r.ppTimeOnIce || 0; });
        } catch (e) { console.warn('Recent PP TOI unavailable:', e.message); }
      }));
      return out;
    }

    // Tonight's PP units (v2.4) over the dressing skaters — the ledger's rule.
    function teamPpRoles(skaters, dressing, prior) {
      return M.ppRoles(skaters.filter(function(sk) { return dressing[sk.playerId]; }).map(function(sk) {
        var pr = prior.skaters[sk.playerId];
        return {
          id: sk.playerId,
          recentPp: (state.playerGameLogs[sk.playerId] || []).map(function(g) { return state.recentPpToi[sk.playerId + ':' + g.gameId] || 0; }),
          priorPpPG: pr && pr.gp ? (pr.ppToi || 0) / pr.gp : null
        };
      }));
    }

    async function fetchGates() {
      try {
        var r = await fetch('lib/nhl-gates.json', { cache: 'no-store' });
        if (r.ok) return (await r.json()).gates;

    // Today's rows in the tracked ledger (scripts/daily-predict.mjs). When a row
    // exists it is what the page shows for that market — so what you see is what
    // gets graded — and the live model fills in anything not yet snapshotted.
    async function fetchLedger(dateStr) {
      var out = [];
      try {
        for (var off = 0; ; off += 1000) {
          var res = await fetch(SUPA_BASE + 'nhl_picks?select=*&game_date=eq.' + dateStr + '&order=id&limit=1000&offset=' + off, { headers: { apikey: ODDS_FEED_KEY } });
          if (!res.ok) throw new Error('ledger ' + res.status);
          var page = await res.json();
          out = out.concat(page);
          if (page.length < 1000) break;
        }
      } catch (e) { console.warn('Ledger unavailable:', e.message); }
      return out;
    }

    // This season's PP time on ice per skater (for the player panel's PP share).
    async function fetchCurrentToiSplits() {

        var d = await fetchLegacyAPI('/skater/timeonice?limit=-1&cayenneExp=' + encodeURIComponent('seasonId=' + getSeasonId() + ' and gameTypeId=2'));

    function fullNameOf(sk) {
      return ((sk.firstName && sk.firstName.default) || '') + ' ' + ((sk.lastName && sk.lastName.default) || '');
    }
    function shortNameOf(sk) {
      return fullNameOf(sk).trim() || ((sk.lastName && sk.lastName.default) || '');
    }

    function ledgerMarket(r) {
      function num(x) { return x == null ? null : Number(x); }
      return {
        market: r.market, line: num(r.line), side: r.side, lambda: num(r.lambda), probOver: num(r.prob_over),
        probSide: num(r.prob_side), priced: r.priced, fairSide: num(r.fair_side), lambdaMarket: num(r.lambda_market),
        price: r.price, book: r.book, link: null, ev: num(r.ev), score: num(r.score), qualifies: r.qualifies,
        official: r.is_official, reason: r.gate_reason, tracked: true, snapshotAt: r.snapshot_at,
        actual: r.actual, hit: r.hit, graded: !!r.graded_at, units: num(r.units)
      };
    }

    function finishProjection(p) {
      // legacy field names the modal / Lines / Streaks tabs read
      p.projGoals = p.lambda.goals; p.projAssists = p.lambda.assists;
      p.projPoints = p.lambda.points; p.projShots = p.projSOG = p.lambda.sog;
      p.probGoal = 1 - Math.exp(-p.lambda.goals);
      p.probAssist = 1 - Math.exp(-p.lambda.assists);
      p.probPoint = 1 - Math.exp(-p.lambda.points);
      p.officialMarkets = M.MARKETS.filter(function(m) { return p.markets[m] && p.markets[m].official; });
      p.juiceMarkets = M.MARKETS.filter(function(m) { return p.markets[m] && p.markets[m].qualifies && !p.markets[m].official; });
      p.qualifyingMarkets = M.MARKETS.filter(function(m) { return p.markets[m] && p.markets[m].qualifies; });
      p.tracked = M.MARKETS.some(function(m) { return p.markets[m] && p.markets[m].tracked; });
      var best = null;
      M.MARKETS.forEach(function(m) { var r = p.markets[m]; if (r && r.score != null && (best == null || r.score > best)) best = r.score; });
      p.bestScore = best;
      return p;
    }

    function buildProjections() {
      var prior = _priorSeasonTotals || { skaters: {} };
      var curT = _teamTotals[getSeasonId()] || {}, priorT = _teamTotals[priorSeasonId()] || {};
      var league = M.leagueContext(
        Object.keys(prior.skaters).map(function(id) { return prior.skaters[id]; }),
        Object.keys(priorT).map(function(k) { return priorT[k]; })
      );
      var quotes = M.quotesFromEvents(state.oddsBoards || []);
      var ledger = {};
      (state.ledgerRows || []).forEach(function(r) { ledger[r.player_id + ':' + r.market] = r; });
      var gates = state.gates || M.DEFAULT_GATES;
      var out = [], pending = [];

      state.games.forEach(function(game) {
        [[game.awayTeam.abbrev, game.homeTeam.abbrev, false], [game.homeTeam.abbrev, game.awayTeam.abbrev, true]].forEach(function(t) {
          var team = t[0], opp = t[1], isHome = t[2];
          var isB2B = isBackToBack(team, game.gameDate);
          var oc = curT[opp] || { gp: 0, ga: 0, sa: 0 }, op = priorT[opp] || null;
          var skaters = (state.teamStats[team] && state.teamStats[team].skaters) || [];
          var lu = teamLineupOut(team, skaters, ledger), lineupOut = lu.out;
          var ppRoles = teamPpRoles(skaters, lu.dressing, prior);
          skaters.forEach(function(sk) {
            var pid = sk.playerId, pr = prior.skaters[pid], gp = sk.gamesPlayed || 0;
            var hasLedger = M.MARKETS.some(function(m) { return ledger[pid + ':' + m]; });
            if (!gp && !pr && !hasLedger) return; // no NHL games to stand on
            var logs = state.playerGameLogs[pid] || [];
            var input = {
              pos: sk.positionCode,
              cur: { gp: gp, toi: (sk.avgTimeOnIcePerGame || 0) * gp, ppToi: ((state.toiSplits[pid] || {}).ppToiPG || 0) * gp, shots: sk.shots || 0, goals: sk.goals || 0, assists: sk.assists || 0, points: sk.points || 0 },
              prior: pr ? { gp: pr.gp, toi: pr.toi, ppToi: pr.ppToi || 0, shots: pr.shots, goals: pr.goals, assists: pr.assists, points: pr.points } : null,
              recent: logs.slice(0, 10).map(function(g) { return { toi: parseTOI(g.toi), ppToi: state.recentPpToi[pid + ':' + g.gameId] || 0, shots: g.shots || 0, goals: g.goals || 0, assists: g.assists || 0, points: g.points || 0 }; }),
              opp: { gp: oc.gp, ga: oc.ga, sa: oc.sa, prior: op },
              isHome: isHome, isB2B: isB2B, lineupOut: lineupOut, ppRole: lu.dressing[pid] ? ppRoles[pid] : null
            };
            var proj = M.project(input, league);
            if (!proj && !hasLedger) return;
            var name = fullNameOf(sk).trim();
            var injury = injuryOf(team, name, sk.positionCode, M.MARKETS.map(function(m) { return ledger[pid + ':' + m]; }).filter(Boolean)[0]);
            var p = {
              id: pid, name: name, shortName: shortNameOf(sk), position: sk.positionCode, team: team, opponent: opp,
              isHome: isHome, isB2B: isB2B, gameId: game.id, startTimeUTC: game.startTimeUTC, injury: injury,
              gamesPlayed: gp, seasonShots: sk.shots || 0, seasonGoals: sk.goals || 0, seasonAssists: sk.assists || 0,
              seasonPoints: sk.points || 0, avgToi: sk.avgTimeOnIcePerGame || 0,
              splits: calculateHomeRoadSplits(logs), streak: detectStreak(logs, 'points'), gameLogs: logs.slice(0, 10),
              lambda: {}, markets: {},
              toiProj: proj ? proj.toiProj : null, priorWeight: proj ? proj.priorWeight : null,
              factors: proj ? proj.factors : { isHome: isHome, isB2B: isB2B }
            };
            var evidence = gp + (pr ? pr.gp : 0);
            var q = {};
            pending.push({ p: p, proj: proj, evidence: evidence });

          });
        });
      });
      // price + gate after everyone is projected (same-name skaters: see ambiguousNameIds)
      var noPrice = M.ambiguousNameIds(pending.filter(function(x) { return x.proj; }).map(function(x) { return { id: x.p.id, name: x.p.name, points: x.proj.lambda.points }; }));
      pending.forEach(function(x) {
        var p = x.p, proj = x.proj;
        var q = noPrice[p.id] ? {} : (quotes[M.normName(p.name)] || {});
        M.MARKETS.forEach(function(m) {
          var lr = ledger[p.id + ':' + m];
          if (lr) { p.markets[m] = ledgerMarket(lr); p.lambda[m] = Number(lr.lambda); return; }
          if (!proj) return;
          var r = M.priceMarket(m, proj.lambda[m], M.quoteFor(m, q[m]));
          r.evidenceGp = x.evidence;
          r.curGp = p.gamesPlayed;
          var v = M.gateVerdict(r, gates);
          r.qualifies = v.qualifies; r.official = v.official; r.reason = v.reason; r.tracked = false;
          p.markets[m] = r; p.lambda[m] = proj.lambda[m];
        });
        if (M.MARKETS.some(function(m) { return p.lambda[m] == null; })) return;
        out.push(finishProjection(p));
      });
      return out;
    }

    // official → probation-qualifying → priced → unpriced, then edge within each
    function playRank(r) {
      if (!r) return null;
      var tier = r.official ? 3 : r.qualifies ? 2 : r.priced && r.score != null ? 1 : 0;
      return tier * 10 + (r.score != null ? Math.max(-5, Math.min(5, r.score)) : -5);
    }

    function sortValue(p, col) {
      var mk = state.projMarket !== 'all' ? p.markets[state.projMarket] : null;
      switch (col) {
        case 'score': return mk ? mk.score : p.bestScore;
        case 'rank': return mk ? playRank(mk) : Math.max.apply(null, M.MARKETS.map(function(m) { return playRank(p.markets[m]) || -99; }));
        case 'ev': return mk ? mk.ev : null;
        case 'probSide': return mk ? mk.probSide : null;
        case 'lambda': return mk ? mk.lambda : null;
        case 'line': return mk ? mk.line : null;
        case 'toiProj': return p.toiProj;
        default: return p[col];
      }
    }

    // Missing values sink in BOTH directions — an absent line is not a zero one.
    function sortProjections() {
      var col = state.sortColumn, dir = state.sortDirection === 'asc' ? 1 : -1;
      state.projections.sort(function(a, b) {
        var x = sortValue(a, col), y = sortValue(b, col);
        var xn = x == null || isNaN(x), yn = y == null || isNaN(y);
        if (xn && yn) return (b.projPoints || 0) - (a.projPoints || 0);
        if (xn) return 1;
        if (yn) return -1;
        return (x - y) * dir;
      });
    }

    // ========== DATA LOADING ==========
    async function loadAllData() {
      state.loading = true;

      state.teamStats = {};
      state.playerGameLogs = {};
      state.goalieStats = {};
      state.goalieGameLogs = {};
      state.teamSchedules = {};
      state.realtimeStats = {};
      state.realtimeStatsLoaded = false;
      state.realtimeStatsError = null;
      state.oddsData = {};
